name: Full Test Suite

on:
  workflow_dispatch:
  # Restored at the merge to `main` (PDR-0043 reversal trigger 2). It was deleted
  # while the recovery lived on a branch: the scheduler reads this file from the
  # DEFAULT branch, so a cron enabled then would have kept running against a `main`
  # that was 167 commits stale — which is what produced its 15-run failure streak
  # and GitHub's dormancy disable. `main` now carries the recovery, so the nightly
  # tests something someone is working on again.
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  full:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v1

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Validate configs first (fail-fast before pytest)
        run: |
          echo "Running universe compiler validation before pytest to catch invalid configs early"
          uv run python scripts/validate_compiler_cli.py

      - name: Run complete test matrix (including slow markers)
        env:
          PYTEST_ADDOPTS: ""
        run: uv run pytest -m "slow or not slow"
