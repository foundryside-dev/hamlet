name: Full Test Suite

on:
  workflow_dispatch:
  # Restored at the merge to `main` (PDR-0043 reversal trigger 2). It was deleted
  # while the recovery lived on a branch: the scheduler reads this file from the
  # DEFAULT branch, so a cron enabled then would have kept running against a `main`
  # frozen at f0a9ae8a, ~160 commits behind the branch. This workflow had never
  # passed — every scheduled run since 2025-11-03 was red, the last 64 of them
  # against that untouched `main` — until GitHub's dormancy rule disabled it, so
  # re-enabling it from the branch would only have resumed that stream against the
  # wrong tree. `main` now carries the recovery, so the nightly tests something
  # someone is working on again. Since a725bf66 this job and the per-push Tests job
  # are the same bare `uv run pytest` — the `slow` marker is gone — and differ only
  # in trigger.
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  full:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v1

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Validate configs first (fail-fast before pytest)
        run: |
          echo "Running universe compiler validation before pytest to catch invalid configs early"
          uv run python scripts/validate_compiler_cli.py

      # No marker deselection exists any more (hamlet-a0832f9004 / hamlet-6f98e38a36):
      # the default `uv run pytest` IS the complete suite. This job differs from
      # tests.yml only in WHEN it runs — nightly against the default branch.
      - name: Run the complete test suite
        run: uv run pytest
