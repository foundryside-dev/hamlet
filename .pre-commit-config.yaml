# Pre-commit hooks for code quality enforcement
# Install with: pip install pre-commit && pre-commit install

# Ruff and black run from the project lockfile via `uv run`, NOT from pinned
# upstream revs. A pinned rev is a second, invisible version of the toolchain:
# the hooks were pinned to black 25.11.0 / ruff v0.14.5 while the lock resolved
# black 26.3.1 / ruff 0.15.12, so every commit was formatted by a different
# binary than CI checked with, and the black gate re-broke on its own. Local
# hooks make the committed formatting and the gate the same thing by
# construction.
repos:
  # Ruff - Fast Python linter and formatter
  - repo: local
    hooks:
      - id: ruff
        name: Ruff Linter (auto-fix)
        description: Run ruff linter with auto-fix on staged files
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
        exclude: ^(\.claude/|htmlcov/|runs/|\.uv-cache/|coverage.*|.*\.msgpack$)

  # Black - Python code formatter
  - repo: local
    hooks:
      - id: black
        name: Black Formatter
        entry: uv run black
        language: system
        types_or: [python, pyi]
        require_serial: true
        exclude: ^(\.claude/|htmlcov/|runs/|\.uv-cache/|coverage.*|.*\.msgpack$)

  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        name: Trim Trailing Whitespace
        exclude: ^(\.claude/|htmlcov/|runs/|\.uv-cache/|coverage.*|.*\.msgpack$)
      - id: end-of-file-fixer
        name: Fix End of Files
        exclude: ^(\.claude/|htmlcov/|runs/|\.uv-cache/|coverage.*|.*\.msgpack$)
      - id: check-yaml
        name: Check YAML Syntax
        args: [--unsafe]  # Allow custom YAML tags
        exclude: ^(\.claude/|htmlcov/|runs/|\.uv-cache/|coverage.*|.*\.msgpack$)
      - id: check-added-large-files
        name: Check for Large Files
        args: [--maxkb=1000]
      - id: check-merge-conflict
        name: Check for Merge Conflicts
      - id: mixed-line-ending
        name: Fix Mixed Line Endings
        args: [--fix=lf]
        exclude: ^(\.claude/|htmlcov/|runs/|\.uv-cache/|coverage.*|.*\.msgpack$)
