environment:
  version: "1.0"

  meters:
    - name: energy
      description: "Physical energy for movement and actions"
      range_type: normalized
    - name: health
      description: "Basic well-being; recover at doctor"
      range_type: normalized
    - name: money
      description: "Economic resource for purchasing"
      range_type: normalized
    - name: sustenance
      description: "Food and nutrition for maintaining energy"
      range_type: normalized

  cascade_graph: []

  modulation_graph: []

  affordances:
    - name: SLEEP
      description: "Rest to restore energy"
      category: sustenance
    - name: DOCTOR
      description: "Medical checkup to restore health"
      category: health
    - name: WORK
      description: "Earn money at the cost of energy"
      category: money
    - name: COOK
      description: "Cook food to restore energy"
      category: sustenance

  variables:
    - name: deficit_energy
      type: scalar
      dims: 1
      scope: agent
      description: "How far below target energy (0.0 = at/above target)"
      normalization:
        method: normalize
        range: [0.0, 1.0]

    - name: time_since_last_sleep
      type: scalar
      dims: 1
      scope: agent
      description: "Timesteps since last SLEEP action"
      normalization:
        method: normalize
        range: [0.0, 100.0]

    - name: deficit_health
      type: scalar
      dims: 1
      scope: agent
      description: "How far below max health (0.0 = at/above target)"
      normalization:
        method: normalize
        range: [0.0, 1.0]

    - name: time_since_last_doctor
      type: scalar
      dims: 1
      scope: agent
      description: "Timesteps since last DOCTOR action"
      normalization:
        method: normalize
        range: [0.0, 100.0]

    - name: deficit_satiation
      type: scalar
      dims: 1
      scope: agent
      description: "How far below max satiation (0.0 = at/above target)"
      normalization:
        method: normalize
        range: [0.0, 1.0]

    - name: time_since_last_cook
      type: scalar
      dims: 1
      scope: agent
      description: "Timesteps since last COOK action"
      normalization:
        method: normalize
        range: [0.0, 100.0]

  cues: []
