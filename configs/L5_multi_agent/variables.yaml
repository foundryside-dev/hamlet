variables:
  version: '1.0'
  evaluation_mode: mark_and_sweep
  debug_logging: false
  extents:
    num_affordances: 4
  item_profiles: []
  declarations:
  - id: deficit_energy
    scope: agent
    type: scalar
    lifetime: tick
    semantic_type: custom
    exposed_to:
    - agent
    initial_value: 0.0
    normalization:
      kind: minmax
      min: 0.0
      max: 1.0
      clip: true
    description: How far below target energy (0.0 = at/above target)
  - id: time_since_last_sleep
    scope: agent
    type: scalar
    lifetime: tick
    semantic_type: custom
    exposed_to:
    - agent
    initial_value: 0.0
    normalization:
      kind: minmax
      min: 0.0
      max: 100.0
      clip: true
    description: Timesteps since last SLEEP action
  - id: trust
    scope: pair
    type: scalar
    lifetime: episode
    semantic_type: custom
    exposed_to: []
    initial_value: 0.5
    description: Directed trust from one agent to another.
  - id: occupied_by
    scope: affordance
    type: agent_ref
    lifetime: tick
    semantic_type: custom
    exposed_to: []
    initial_value: null
    description: Current claimant for each affordance row, using -1 for free rows.
