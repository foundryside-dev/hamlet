# L5's "multi-agent" premise is not true today. The env batch is N independent
# single-agent worlds (owner ruling S1, 2026-10-25): agents never share a world, so
# this pack runs N agents side by side, each alone. The relational state it used to
# declare (pair-scope `trust`, the never-written affordance `occupied_by`) is gone
# with the pair scope. A shared world needs a declared agents-per-world parameter;
# until then this pack is a small single-agent survival level.
variables:
  version: '1.0'
  item_profiles: []
  declarations:
  - id: deficit_energy
    readable_by: [engine, agent]
    writable_by: [engine]
    scope: agent
    type: scalar
    lifetime: tick
    semantic_type: custom
    exposed_to:
    - agent
    initial_value: 0.0
    expression: max(0.0, 0.5 - bar.energy)
    normalization:
      kind: minmax
      min: 0.0
      max: 0.5
      clip: true
    description: How far energy sits below the 0.5 target (0.0 = at or above target)
  # A "time since" mechanic in one declaration (WP14): the expression reads its own
  # value one tick ago through lag, which reads history, not this tick, so it is no
  # cycle. The event is "energy rose this tick", and in this pack only SLEEP raises
  # energy (+0.8; recovery.natural is 0 and every other affordance costs energy). A
  # sleep at full energy changes nothing and so does not count. initial_value -1.0 is
  # the history seed: before a tick of history exists lag returns the episode-start
  # value, so the first tick of every episode reads -1 + 1 = 0.
  - id: time_since_last_sleep
    readable_by: [engine, agent]
    writable_by: [engine]
    scope: agent
    type: scalar
    lifetime: episode
    semantic_type: custom
    exposed_to:
    - agent
    initial_value: -1.0
    expression: where(delta(bar.energy) > 0.0, 0.0, lag(time_since_last_sleep, 1) + 1.0)
    normalization:
      kind: minmax
      min: 0.0
      max: 1200.0
      clip: true
    description: Ticks since energy last rose (a SLEEP), or since the episode began
