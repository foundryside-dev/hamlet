# L5's "multi-agent" premise is not true today. The env batch is N independent
# single-agent worlds (owner ruling S1, 2026-10-25): agents never share a world, so
# this pack runs N agents side by side, each alone. The relational state it used to
# declare (pair-scope `trust`, the never-written affordance `occupied_by`) is gone
# with the pair scope. A shared world needs a declared agents-per-world parameter;
# until then this pack is a small single-agent survival level.
variables:
  version: '1.0'
  item_profiles: []
  declarations:
  - id: deficit_energy
    readable_by: [engine, agent]
    writable_by: [engine]
    scope: agent
    type: scalar
    lifetime: tick
    semantic_type: custom
    exposed_to:
    - agent
    initial_value: 0.0
    expression: max(0.0, 0.5 - bar.energy)
    normalization:
      kind: minmax
      min: 0.0
      max: 0.5
      clip: true
    description: How far energy sits below the 0.5 target (0.0 = at or above target)
