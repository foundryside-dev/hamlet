training:
  version: "1.0"

  population:
    size: 512

  # Environment runtime controls
  enabled_affordances: null
  randomize_affordances: true

  enabled_actions:
    custom:
      - REST
      - MEDITATE

  q_learning:
    use_double_dqn: true
    gamma: 0.99
    learning_rate: 0.0001
    target_update_frequency: 1000

  replay_buffer:
    capacity: 100000
    batch_size: 256
    min_size: 1000

  exploration:
    epsilon_start: 1.0
    epsilon_end: 0.01
    epsilon_decay: 0.995

  intrinsic:
    rnd:
      feature_dim: 128
      learning_rate: 0.0001

    annealing:
      threshold: 100.0
      decay_rate: 0.995
      min_weight: 0.01

  training_loop:
    max_episodes: 100000
    max_steps_per_episode: 1000

    evaluation:
      interval: 1000
      num_episodes: 10

    checkpointing:
      interval: 5000
      keep_last: 5

  curriculum:
    strategy: static

    adversarial:
      difficulty_metric: survival_rate
      adaptation_rate: 0.1
      min_difficulty: 0.2
      max_difficulty: 1.0
