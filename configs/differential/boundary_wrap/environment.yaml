environment:
  version: "1.0"

  meters:
    - name: energy
      description: "Physical energy for movement and actions"
      range_type:
        kind: minmax
        clip: false

    - name: health
      description: "Physical health, death at 0"
      range_type:
        kind: minmax
        clip: false

    - name: satiation
      description: "Hunger level, affects health cascade"
      range_type:
        kind: minmax
        clip: false

    - name: hygiene
      description: "Cleanliness, affects mood and social"
      range_type:
        kind: minmax
        clip: false

    - name: money
      description: "Economic resource for purchasing"
      range_type:
        kind: minmax
        clip: false

    - name: fitness
      description: "Physical conditioning from exercise"
      range_type:
        kind: minmax
        clip: false

    - name: mood
      description: "Mental state, affects energy cascade"
      range_type:
        kind: minmax
        clip: false

    - name: social
      description: "Social connection level"
      range_type:
        kind: minmax
        clip: false

  cascade_graph:
    - source: satiation
      target: health
      description: "Low hunger damages health over time"

    - source: satiation
      target: energy
      description: "Low hunger drains energy"

    - source: mood
      target: energy
      description: "Low mood reduces energy recovery"

    - source: hygiene
      target: mood
      description: "Poor hygiene damages mood"

    - source: hygiene
      target: social
      description: "Poor hygiene damages social connection"

  modulation_graph:
    - bar: energy
      affordances: [WORK]
      description: "Low energy reduces work effectiveness"

    - bar: mood
      affordances: [SOCIALIZE, WORK]
      description: "Low mood reduces social and work quality"

  affordances:
    - name: EAT
      description: "Consume food to restore satiation"
      category: sustenance

    - name: SLEEP
      description: "Rest to restore energy"
      category: sustenance

    - name: SHOWER
      description: "Clean to restore hygiene"
      category: hygiene

    - name: EXERCISE
      description: "Physical activity for fitness"
      category: fitness

    - name: WORK
      description: "Employment for money income"
      category: economic

    - name: SOCIALIZE
      description: "Social interaction"
      category: social

    - name: MEDITATE
      description: "Mental restoration for mood"
      category: mental

    - name: DRINK_WATER
      description: "Hydration (combined with satiation)"
      category: sustenance

    - name: BRUSH_TEETH
      description: "Dental hygiene"
      category: hygiene

    - name: LAUNDRY
      description: "Clothing hygiene"
      category: hygiene

    - name: COOK
      description: "Food preparation"
      category: sustenance

    - name: CLEAN_HOUSE
      description: "Environmental hygiene"
      category: hygiene

    - name: ENTERTAINMENT
      description: "Leisure for mood"
      category: mental

    - name: DOCTOR
      description: "Medical care for health"
      category: health

  # No custom variables. deficit_energy / deficit_satiation /
  # time_since_last_eat / time_since_last_sleep were declared here with no
  # runtime writer — agents observed frozen zeros (hamlet-dc8f887cd5).
  # A variable belongs here only once the authoring surface can drive it.
  variables: []

  cues:
    - name: low_energy_warning
      trigger:
        bar: energy
        threshold: 0.2
        direction: below
      display:
        icon: "⚠️"
        color: "#FF6B6B"
        message: "Energy critically low!"

    - name: high_money_celebration
      trigger:
        bar: money
        threshold: 100.0
        direction: above
      display:
        icon: "💰"
        color: "#51CF66"
        message: "Financial milestone reached!"
