version: '1.0'
evaluation_mode: mark_and_sweep
debug_logging: false
global_profile:
  variables:
  # World-state clock derived from the engine's ambient tick. It remains unexposed because
  # arbitrary expression identity is not representable by the fixed variable-element descriptor.
  - name: time_of_day_phase
    id: time_of_day_phase
    type: float
    semantic_type: temporal
    expression: tick
    description: >-
      World-state clock derived from the ambient engine tick; intentionally unexposed.
item_profiles:
- profile_name: default_item
  variables: []
