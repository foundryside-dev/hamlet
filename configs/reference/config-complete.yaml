# HAMLET Configuration System v2.1.1 - Reference Specification
# =======================================================
# This document is the authoritative reference for HAMLET configuration v2.1.1.
# It describes every field and its intent; treat examples as normative schemas,
# not runnable defaults. Configs are split across files in practice; this single
# reference consolidates them for clarity.
#
# Semantic versioning for the spec:
#   - MAJOR: Breaking changes to layout/semantics (obs_dim, file shapes, schema)
#   - MINOR: Backwards-compatible additive fields/sections
#   - PATCH: Clarifications and non-behavioral edits (documentation only)
#
# REVISION HISTORY:
# - v2.1.0: Initial complete reference
# - v2.1.1: Clarifications + VFS/Items/Effects uplift scaffolding:
#   * Vision support dimension formulas now show grid-size dependency explicitly
#   * VFS normalization method semantics documented (clip, normalize, standardize, none)
#   * Hyperparameter override hierarchy clarified (agent.yaml defaults, training.yaml overrides)
#   * Implicit substrate fields (position, velocity) now explicitly documented
#   * Curriculum-level action control added to training.yaml
#   * New reference sections added for vfs_profiles.yaml, items.yaml, effects.yaml
#   * Future v3.0 enhancements noted (hidden affordances)
#
# Directory Structure (reference layout):
# configs/my_experiment/
# ├── experiment.yaml      # Section 1
# ├── stratum.yaml         # Section 2
# ├── environment.yaml     # Section 3
# ├── actions.yaml         # Section 4
# ├── agent.yaml           # Section 5
# └── levels/
#     ├── L1_full_obs/
#     │   ├── curriculum.yaml    # Section 6
#     │   ├── bars.yaml          # Section 7
#     │   ├── affordances.yaml   # Section 8
#     │   └── training.yaml      # Section 9
#     └── L2_partial_obs/
#         └── ...

# =============================================================================
# SECTION 1: experiment.yaml (Experiment-Level Metadata)
# =============================================================================
# Location: configs/my_experiment/experiment.yaml
# Purpose: High-level metadata about the experiment
# Breaking: NO (metadata doesn't affect obs_dim or checkpoint compatibility)

experiment:
  version: "1.0"
  experiment_name: "Complete Reference Example"

  metadata:
    name: "Complete Reference Example"
    description: "Comprehensive demonstration of all v2.1 config options"
    author: "HAMLET Team"
    created: "2025-11-15"
    tags: ["reference", "tutorial", "complete"]

  # Experiment-level settings
  curriculum_levels:
    - L0_0_minimal
    - L0_5_dual_resource
    - L1_full_observability
    - L2_partial_observability
    - L3_temporal_mechanics

  # Observation mode is defined in stratum.yaml (see Section 2).

# =============================================================================
# SECTION 2: stratum.yaml (World Topology & Supported Observations)
# =============================================================================
# Location: configs/my_experiment/stratum.yaml
# Purpose: Defines the world topology and which observation fields CAN exist.
# Tags: [BREAKING], [OBS_DIM]
# Rule: If a setting changes tensor shape, it is BREAKING and must be scoped at
#       the experiment level.

stratum:
  version: "1.0"

  # ---------------------------------------------------------------------------
  # [CONFIG] Substrate Definition
  # [TAGS]   BREAKING, OBS_DIM
  # ---------------------------------------------------------------------------
  substrate:
    type: grid
    # Valid options:
    #   grid        : 2D grid
    #   grid3d      : 3D grid
    #   gridnd      : ND grid
    #   continuous  : 2D continuous
    #   continuousnd: ND continuous
    #   aspatial    : No spatial embedding

    grid:
      # [BREAKING][OBS_DIM] Vision windows depend on width/height.
      width: 8   # Example: 8
      height: 8  # Example: 8

      # [CONFIG] Topology (does NOT change dims)
      # | Option   | Behavior                          |
      # | square   | Square grid                       |
      # | hexagonal| Hex tiling                        |
      topology: square

      # [CONFIG] Boundary (value-only, non-breaking)
      # | clamp  | Hard walls; agent stops at edges    |
      # | wrap   | Toroidal; teleports to opposite edge|
      # | bounce | Elastic reflection                  |
      # | sticky | Gets stuck at edges                 |
      boundary: clamp

      # [CONFIG] Distance metric (non-breaking)
      # | manhattan | L1                               |
      # | euclidean | L2                               |
      # | chebyshev | L∞                               |
      distance_metric: manhattan

      # [CONFIG] Observation encoding (non-breaking; dims unchanged)
      # | relative | Normalized [0,1] coordinates      |
      # | scaled   | [0, grid_size] coordinates        |
      # | absolute | Raw coordinates                   |
      observation_encoding: relative

    # Example alternate (continuous):
    # type: continuous
    # continuous:
    #   dimensions: 2
    #   bounds:
    #     - [0.0, 10.0]
    #     - [0.0, 10.0]
    #   boundary: clamp
    #   movement_delta: 0.5
    #   interaction_radius: 1.0
    #   distance_metric: euclidean
    #   observation_encoding: relative
    #   action_discretization:
    #     num_directions: 8  # REQUIRED, 8-32
    #     num_magnitudes: 3  # REQUIRED, 3-7

  # ---------------------------------------------------------------------------
  # [CONFIG] Vision Support
  # [TAGS]   BREAKING, OBS_DIM
  # ---------------------------------------------------------------------------
  # DIMS FORMULA:
  #   global  -> +(width * height)
  #   partial -> +(window_width * window_height)
  #   both    -> +(width * height) + (window_width * window_height)
  #   none    -> +0
  # Guidance: Use 'both' to allocate space for transfer (mask at curriculum).
  vision_support: both
  # Valid options:
  #   global  : Full grid observability only.
  #   partial : Local window (POMDP) only.
  #   both    : Allocates both; curriculum masks one view.
  #   none    : Blind agent (meters/internal state only).

  # Observation mode (layout strategy)
  #   full_auto   : include all configured fields (masked fields remain allocated)
  #   max_compact : drop masked/unused fields to minimize obs_dim
  #   full_manual : include only explicit include_fields (required)
  observation_mode:
    mode: full_auto
    # include_fields: ["obs_grid_encoding", "obs_meters"]  # required when mode=full_manual

  # ---------------------------------------------------------------------------
  # [CONFIG] Temporal Support
  # [TAGS]   BREAKING, OBS_DIM
  # ---------------------------------------------------------------------------
  # DIMS CONTRIBUTION (when enabled): +4 (time_sin, time_cos, day_progress, is_night)
  temporal_support: enabled
  # Valid options:
  #   enabled  : Adds temporal fields (+4 dims)
  #   disabled : No temporal fields

  # ---------------------------------------------------------------------------
  # [DERIVED] Implicit Substrate Observation Fields
  # ---------------------------------------------------------------------------
  # These fields always exist based on substrate.type; listed here for clarity.
  # Grid2D / Grid3D / GridND:
  #   agent_position: +2 / +3 / +N dims
  #   agent_velocity: +2 / +3 / +N dims
  # Continuous / ContinuousND:
  #   agent_position: +N dims
  #   agent_velocity: +N dims
  # Aspatial:
  #   No position or velocity fields (+0 dims)

# =============================================================================
# SECTION 3: environment.yaml (World Vocabulary)
# =============================================================================
# Location: configs/my_experiment/environment.yaml
# Purpose: Defines WHAT exists in the world (vocabulary). Levels define HOW.
# Tags: [BREAKING], [OBS_DIM] where noted.

environment:
  version: "1.0"

  # ---------------------------------------------------------------------------
  # [CONFIG] Meters
  # [TAGS]   BREAKING, OBS_DIM
  # ---------------------------------------------------------------------------
  # Each meter adds +1 dim to observation space.
  meters:
    - name: energy
      description: "Physical energy for movement and actions"
      range_type: normalized
      # range_type is metadata only (UI display hint), does NOT affect obs_dim
      # | normalized | UI displays as 0-100%              |
      # | unbounded  | UI displays raw value (can exceed) |
      # | integer    | UI displays as integer points      |

    - name: health
      description: "Physical health, death at 0"
      range_type: normalized

    - name: satiation
      description: "Hunger level, affects health cascade"
      range_type: normalized

    - name: hygiene
      description: "Cleanliness, affects mood and social"
      range_type: normalized

    - name: money
      description: "Economic resource for purchasing"
      range_type: unbounded  # Can exceed 1.0 with job income

    - name: fitness
      description: "Physical conditioning from exercise"
      range_type: normalized

    - name: mood
      description: "Mental state, affects energy cascade"
      range_type: normalized

    - name: social
      description: "Social connection level"
      range_type: normalized

  # BREAKING: Adding/removing meters changes obs_dim (+1 per meter)
  # Current: 8 meters = +8 dims

  # ---------------------------------------------------------------------------
  # [CONFIG] Cascade Graph
  # [TAGS]   BREAKING, OBS_DIM (structure only)
  # ---------------------------------------------------------------------------
  # Defines which meter cascades CAN exist. Parameters (threshold, strength)
  # are defined in levels/*/bars.yaml.
  cascade_graph:
    - source: satiation
      target: health
      description: "Low hunger damages health over time"

    - source: satiation
      target: energy
      description: "Low hunger drains energy"

    - source: mood
      target: energy
      description: "Low mood reduces energy recovery"

    - source: hygiene
      target: mood
      description: "Poor hygiene damages mood"

    - source: hygiene
      target: social
      description: "Poor hygiene damages social connection"

  # Validation: All curriculum levels MUST implement all cascades. To disable:
  # set strength: 0.0 in bars.yaml (explicit disable).

  # ---------------------------------------------------------------------------
  # [CONFIG] Modulation Graph
  # ---------------------------------------------------------------------------
  # Defines bar → affordance modulation relationships (non-breaking).
  modulation_graph:
    - bar: energy
      affordances: [WORK]
      description: "Low energy reduces work effectiveness"

    - bar: mood
      affordances: [SOCIALIZE, WORK]
      description: "Low mood reduces social and work quality"

  # ---------------------------------------------------------------------------
  # [CONFIG] Affordances
  # [TAGS]   BREAKING, OBS_DIM
  # ---------------------------------------------------------------------------
  # Each affordance adds +1 dim (binary visibility). Parameters (costs, effects,
  # opening_hours) are defined in levels/*/affordances.yaml. For v2.1 all
  # affordances are observable; hidden affordances are a future enhancement.
  affordances:
    - name: EAT
      description: "Consume food to restore satiation"
      category: sustenance

    - name: SLEEP
      description: "Rest to restore energy"
      category: sustenance

    - name: SHOWER
      description: "Clean to restore hygiene"
      category: hygiene

    - name: EXERCISE
      description: "Physical activity for fitness"
      category: fitness

    - name: WORK
      description: "Employment for money income"
      category: economic

    - name: SOCIALIZE
      description: "Social interaction"
      category: social

    - name: MEDITATE
      description: "Mental restoration for mood"
      category: mental

    - name: DRINK_WATER
      description: "Hydration (combined with satiation)"
      category: sustenance

    - name: BRUSH_TEETH
      description: "Dental hygiene"
      category: hygiene

    - name: LAUNDRY
      description: "Clothing hygiene"
      category: hygiene

    - name: COOK
      description: "Food preparation"
      category: sustenance

    - name: CLEAN_HOUSE
      description: "Environmental hygiene"
      category: hygiene

    - name: ENTERTAINMENT
      description: "Leisure for mood"
      category: mental

    - name: DOCTOR
      description: "Medical care for health"
      category: health

  # BREAKING: Adding/removing affordances changes obs_dim (+1 per affordance)
  # Current: 14 affordances = +14 dims

  # VFS variables/profiles are defined in vfs_profiles.yaml (Section 10).

  # ---------------------------------------------------------------------------
  # [CONFIG] Cues
  # [TAGS]   NON-BREAKING
  # ---------------------------------------------------------------------------
  # Cues provide UI hints for visualization; they do NOT affect observations.
  cues:
    - name: low_energy_warning
      trigger:
        bar: energy
        threshold: 0.2
        direction: below
      display:
        icon: "⚠️"
        color: "#FF6B6B"
        message: "Energy critically low!"

    - name: high_money_celebration
      trigger:
        bar: money
        threshold: 100.0
        direction: above
      display:
        icon: "💰"
        color: "#51CF66"
        message: "Financial milestone reached!"

# =============================================================================
# SECTION 4: actions.yaml (Action Vocabulary)
# =============================================================================
# Location: configs/my_experiment/actions.yaml
# Purpose: Defines which actions exist (vocabulary).
# Tags: [BREAKING] where noted (action_dim changes).

actions:
  version: "1.0"

  # ---------------------------------------------------------------------------
  # [CONFIG] Substrate Actions
  # [TAGS]   BREAKING
  # ---------------------------------------------------------------------------
  substrate_actions:
    inherit: true
    # Inherit movement actions from substrate:
    #   Grid2D: UP, DOWN, LEFT, RIGHT, UP_LEFT, UP_RIGHT, DOWN_LEFT, DOWN_RIGHT (8)
    #   Grid3D: Above plus UP_Z, DOWN_Z (10)
    #   Aspatial: No movement actions (0)

  # ---------------------------------------------------------------------------
  # [CONFIG] Custom Actions
  # [TAGS]   BREAKING
  # ---------------------------------------------------------------------------
  # Reserved: INTERACT, GET, USE_SLOT_*, DROP_SLOT_* (auto-managed; do not override).
  custom_actions:
    - name: WAIT
      description: "Do nothing (pass turn)"
      enabled_by_default: true
      costs: {}
      effects: {}

    - name: REST
      description: "Passive energy recovery (slower than SLEEP)"
      enabled_by_default: false  # Optional action, can be enabled in curriculum
      costs:
        energy: 0.01
      effects:
        energy: 0.1

    - name: MEDITATE
      description: "Passive mood boost (slower than MEDITATE affordance)"
      enabled_by_default: false
      costs:
        energy: 0.01
      effects:
        mood: 0.05

  # BREAKING: Adding/removing actions changes action_dim.
  # Item actions (GET/USE/DROP) auto-add when items.yaml is present; do not
  # define them here. INTERACT is reserved by substrate/affordances.

  # ---------------------------------------------------------------------------
  # [CONFIG] Action Labels
  # [TAGS]   NON-BREAKING
  # ---------------------------------------------------------------------------
  # UI terminology preset only (does not affect action_dim).
  labels:
    preset: gaming
    # Valid presets:
    #   gaming  : UP, DOWN, LEFT, RIGHT, JUMP, CROUCH, ...
    #   6dof    : FORWARD, BACK, LEFT, RIGHT, UP, DOWN, ROLL_LEFT, ...
    #   cardinal: NORTH, SOUTH, EAST, WEST, ...
    #   math    : +X, -X, +Y, -Y, +Z, -Z, ...

# =============================================================================
# SECTION 5: agent.yaml (Agent Perception + Drive + Brain)
# =============================================================================
# Location: configs/my_experiment/agent.yaml
# Purpose: Defines how the agent perceives and processes information.
# Tags: Mostly NON-BREAKING; network/mask shapes must still match obs_dim.

agent:
  version: "1.0"

  # ---------------------------------------------------------------------------
  # [CONFIG] Perception
  # [TAGS]   NON-BREAKING
  # ---------------------------------------------------------------------------
  # Encoding/normalization behavior only; does not add dimensions.
  perception:
    # Note: observation_encoding moved to stratum.yaml (substrate behavioral param)
    # This section is for perception-specific settings that don't affect obs_dim

  # ---------------------------------------------------------------------------
  # [CONFIG] Drive (Reward Function Configuration)
  # [TAGS]   NON-BREAKING
  # ---------------------------------------------------------------------------
  # Drive As Code (DAC) - declarative reward function (values only).
  drive:
    version: "1.0"

    # Modifiers (context-sensitive reward adjustment)
    modifiers:
      energy_crisis:
        type: range_multiplier
        source: energy  # Bar or VFS variable
        ranges:
          - min: 0.0
            max: 0.2
            multiplier: 0.0  # Suppress intrinsic when energy critical
          - min: 0.2
            max: 1.0
            multiplier: 1.0  # Normal intrinsic weight

    # Extrinsic Strategies (base reward from bar states)
    extrinsic:
      type: constant_base_with_shaped_bonus  # Options: multiplicative, additive_unweighted, weighted_sum, etc.
      base: 0.01  # Small positive baseline (prevents "low energy delirium")
      bonuses:
        - bar: energy
          weight: 0.5
          transform: linear  # Options: linear, quadratic, exponential
        - bar: health
          weight: 0.5
          transform: linear

    # Intrinsic Strategies (exploration drive)
    intrinsic:
      strategy: adaptive_rnd  # Options: rnd, icm, count_based, adaptive_rnd, none
      base_weight: 0.1
      apply_modifiers: [energy_crisis]  # Apply crisis suppression

      # Adaptive RND specific settings
      annealing:
        enabled: true
        threshold: 100.0  # Start annealing when mean survival > 100 steps
        decay_rate: 0.995
        min_weight: 0.01

    # Shaping Bonuses (behavioral incentives)
    shaping:
      - type: approach_reward
        target: EAT
        weight: 0.01
        max_distance: 5.0

      - type: completion_bonus
        action: INTERACT
        affordance: SLEEP
        bonus: 0.1

    # Composition
    composition:
      normalize: false
      clip: null
      log_components: true  # Log reward breakdown for debugging
      log_modifiers: true

  # ---------------------------------------------------------------------------
  # [CONFIG] Brain (Network Architecture)
  # [TAGS]   NON-BREAKING (must still align with obs_dim/action_dim)
  # ---------------------------------------------------------------------------
  # Hyperparameter override hierarchy:
  # - This section sets experiment-level defaults.
  # - training.yaml may override per curriculum level.
  # - training.yaml wins on conflict.
  brain:
    architecture: feedforward  # Options: feedforward, recurrent

    # Feedforward-specific settings
    feedforward:
      hidden_sizes: [256, 128]
      activation: relu  # Options: relu, tanh, elu, gelu

    # Recurrent-specific settings (when architecture: recurrent)
    recurrent:
      vision_encoder:
        conv_channels: [32, 64]
        kernel_size: 3
        stride: 1
        output_dim: 128

      position_encoder:
        hidden_size: 32

      meter_encoder:
        hidden_size: 32

      lstm:
        hidden_size: 256
        num_layers: 1

      q_head:
        hidden_sizes: [128]

    # Optimizer settings (experiment-level defaults)
    optimizer:
      type: adam  # Options: adam, sgd, rmsprop
      learning_rate: 0.0001  # Can be overridden in training.yaml per level
      adam_beta1: 0.9        # Required when type: adam
      adam_beta2: 0.999      # Required when type: adam
      adam_eps: 1.0e-8       # Required when type: adam
      weight_decay: 0.0      # L2 weight decay
      schedule:
        type: constant       # Options: constant, step_decay, cosine, exponential

    # Q-Learning algorithm (experiment-level defaults)
    q_learning:
      algorithm: double_dqn  # Options: dqn (vanilla), double_dqn
      gamma: 0.99              # Can be overridden in training.yaml per level
      target_update_frequency: 1000  # Can be overridden in training.yaml per level

    # Loss function (experiment-level defaults)
    loss:
      type: smooth_l1        # Options: smooth_l1, mse, huber
      huber_delta: 1.0       # Used for huber/smooth_l1 variants

# =============================================================================
# SECTION 6: curriculum.yaml (Curriculum-Level Active Field Control)
# =============================================================================
# Location: configs/my_experiment/levels/<level>/curriculum.yaml
# Purpose: Controls which observation fields are ACTIVE vs MASKED.
# Tags: NON-BREAKING (masking only; shapes fixed by stratum/environment).
# Key Principle: Active = "which fields ARE used" (support must declare them).

curriculum:
  version: "1.0"

  # ---------------------------------------------------------------------------
  # [CONFIG] Vision Control
  # [TAGS]   NON-BREAKING (masking only)
  # ---------------------------------------------------------------------------
  active_vision: global  # Options: global, partial
  # Requirements:
  #   active_vision: global  -> vision_support must be global|both
  #   active_vision: partial -> vision_support must be partial|both
  # Behavior:
  #   global  -> grid_encoding ACTIVE, local_window MASKED
  #   partial -> local_window ACTIVE, grid_encoding MASKED

  vision_range: 0.5  # Normalized float [0.0, 1.0]
  # Used when active_vision: partial; still required for no-defaults when global.
  # Formula: radius = ceil(vision_range * (grid_size / 2))
  # Examples (8×8 grid):
  #   0.25 -> radius=1, window=3×3 (9 dims masked/active)
  #   0.5  -> radius=2, window=5×5 (25 dims masked/active)
  #   0.75 -> radius=3, window=7×7 (49 dims masked/active)
  #   1.0  -> radius=4, window=9×9 (81 dims masked/active)

  # ---------------------------------------------------------------------------
  # [CONFIG] Temporal Control
  # [TAGS]   NON-BREAKING (masking only)
  # ---------------------------------------------------------------------------
  active_temporal: false  # Options: true, false
  # Behavior:
  #   true  -> time_sin, time_cos ACTIVE
  #   false -> time_sin, time_cos MASKED
  # Requires: stratum.yaml temporal_support: enabled

  day_length: null  # MANDATORY field (no-defaults principle)
  # - When active_temporal: true → MUST be integer > 0 (e.g., 24)
  # - When active_temporal: false → MUST be null
  #
  # Validation:
  # if active_temporal == true:
  #     assert day_length is not None and day_length > 0
  # if active_temporal == false:
  #     assert day_length is None

# Example curriculum variations:
#
# L1_full_observability/curriculum.yaml:
#   active_vision: global
#   vision_range: 0.5  # Not used but required
#   active_temporal: false
#   day_length: null
#
# L2_partial_observability/curriculum.yaml:
#   active_vision: partial
#   vision_range: 0.5  # 5×5 window on 8×8 grid
#   active_temporal: false
#   day_length: null
#
# L3_temporal_mechanics/curriculum.yaml:
#   active_vision: global
#   vision_range: 0.5  # Not used
#   active_temporal: true
#   day_length: 24

# =============================================================================
# SECTION 7: bars.yaml (Meter Behavioral Parameters)
# =============================================================================
# Location: configs/my_experiment/levels/<level>/bars.yaml
# Purpose: Defines HOW meters behave (parameters, not vocabulary).
# Tags: NON-BREAKING (parameters only; vocab is in environment.yaml).

bars:
  version: "1.0"

  # ---------------------------------------------------------------------------
  # [CONFIG] Meter Parameters
  # [TAGS]   NON-BREAKING (must match meter names from environment.yaml)
  # ---------------------------------------------------------------------------
  meters:
    - name: energy  # Must match environment.yaml meter name
      initial: 1.0  # Starting value [0.0, 1.0]

      depletion:
        passive: 0.01  # Passive drain per timestep
        move: 0.02     # Drain per movement action
        interact: 0.05 # Drain per INTERACT action

      recovery:
        natural: 0.0  # Natural recovery per timestep (usually 0)

      bounds:
        min: 0.0
        max: 1.0
        lethal_min: true  # Death if reaches min
        lethal_max: false

    - name: health
      initial: 1.0
      depletion:
        passive: 0.005
        move: 0.0
        interact: 0.0
      recovery:
        natural: 0.001  # Slow natural healing
      bounds:
        min: 0.0
        max: 1.0
        lethal_min: true
        lethal_max: false

    - name: satiation
      initial: 1.0
      depletion:
        passive: 0.008
        move: 0.01
        interact: 0.0
      recovery:
        natural: 0.0
      bounds:
        min: 0.0
        max: 1.0
        lethal_min: false  # Hunger alone doesn't kill (cascades do)
        lethal_max: false

    # ... (repeat for all 8 meters)

  # ---------------------------------------------------------------------------
  # [CONFIG] Cascade Parameters
  # [TAGS]   NON-BREAKING (structure defined in environment.yaml)
  # ---------------------------------------------------------------------------
  # Must implement ALL cascades from environment.yaml cascade_graph.
  cascades:
    - source: satiation  # Must match cascade_graph
      target: health
      threshold: 0.3    # Trigger when source < threshold
      strength: 0.004   # Damage rate (0.0 = explicit disable)

    - source: satiation
      target: energy
      threshold: 0.3
      strength: 0.006

    - source: mood
      target: energy
      threshold: 0.2
      strength: 0.001

    - source: hygiene
      target: mood
      threshold: 0.4
      strength: 0.003

    - source: hygiene
      target: social
      threshold: 0.4
      strength: 0.0  # DISABLED (explicit disable with strength: 0.0)

  # Validation:
  # - All cascades from environment.yaml MUST be present.
  # - Cannot add cascades not in environment.yaml.
  # - To disable: set strength: 0.0 (explicit disable, not omission).

# =============================================================================
# SECTION 8: affordances.yaml (Affordance Behavioral Parameters)
# =============================================================================
# Location: configs/my_experiment/levels/<level>/affordances.yaml
# Purpose: Defines HOW affordances behave (parameters, not vocabulary).
# Tags: NON-BREAKING (vocabulary in environment.yaml; parameters here).

affordances:
  version: "1.0"

  # ---------------------------------------------------------------------------
  # [CONFIG] Affordance Parameters
  # [TAGS]   NON-BREAKING (names must match environment.yaml)
  # ---------------------------------------------------------------------------
  affordances:
    - name: EAT  # Must match environment.yaml affordance name

      # Interaction semantics (single-tick vs multi-tick vs dual)
      interaction_type: instant  # Options: instant, multi_tick, dual
      # duration_ticks: 3        # Required when interaction_type: multi_tick or dual

      # Costs (bar decreases when action executes instantly)
      costs:
        energy: 0.05    # Using EAT costs 5% energy
        money: 5.0      # Costs $5 (can exceed 1.0 for unbounded meters)

      # Per-tick costs for multi-tick/dual affordances (optional)
      costs_per_tick: {}

      # Canonical effect definition: use interactions (Effects commands).
      # Unified with Items system - declarative command pipeline.
      # DSL: arithmetic expressions and bar/vfs paths are supported.
      interactions:
        on_start:
          - modify: "target.bar.satiation"
            value: "target.bar.satiation + 0.4"   # Restores 40% satiation
          - modify: "target.bar.mood"
            value: "target.bar.mood + 0.05"  # Small mood boost from eating
        per_tick: []
        on_completion: []
        on_early_exit: []
        on_failure: []

      # Availability (when affordance is visible/usable)
      opening_hours:
        enabled: true
        schedule:
          - start: 6   # 6 AM (if day_length: 24)
            end: 22    # 10 PM
      # If opening_hours.enabled: false, affordance always available

      # Deployment (spatial placement for grid substrates)
      deployment:
        type: fixed  # Options: fixed, random, procedural
        positions: [[2, 2], [5, 5]]  # Grid positions

    - name: SLEEP
      interaction_type: multi_tick     # multi-tick sleep affordance
      duration_ticks: 5               # Requires 5 ticks to complete

      # SLEEP multi-tick cost: small per-tick energy cost (e.g., getting into bed)
      costs:
        energy: 0.0
      costs_per_tick:
        energy: 0.01

      # Effects pipeline drives actual behavior using interactions:
      interactions:
        on_start: []  # No instant effects at start
        per_tick:
          - modify: "target.bar.energy"
            value: "target.bar.energy + 0.10"     # +10% energy per tick
        on_completion:
          - modify: "target.bar.energy"
            value: "target.bar.energy + 0.30"     # +30% completion bonus (total ~80%)
          - modify: "target.bar.mood"
            value: "target.bar.mood + 0.10"     # Mood boost after good sleep
        on_early_exit: []
        on_failure: []
      opening_hours:
        enabled: false  # Always available
      deployment:
        type: fixed
        positions: [[0, 0], [7, 7]]

    - name: WORK
      # Dual-mode: can be treated as instant (one-shot) or multi-tick with completion bonus.
      interaction_type: dual
      duration_ticks: 4

      # Instant costs (applied at start for instant interactions)
      costs:
        energy: 0.0
        mood: 0.0

      # Per-tick costs (applied each tick in multi-tick mode)
      costs_per_tick:
        energy: 0.075  # 4 × 7.5% ≈ 30% energy cost
        mood: 0.025    # 4 × 2.5% ≈ 10% mood cost

      # Effects implement multi-tick earnings (net matches 22.5 payout)
      interactions:
        on_start: []  # No immediate income at tick 0
        per_tick:
          - modify: "target.bar.money"
            value: "target.bar.money + 5.625"    # 4 × 5.625 = 22.5 total
        on_completion: []     # All pay handled via per_tick in this example
        on_early_exit: []
        on_failure: []
      opening_hours:
        enabled: true
        schedule:
          - start: 9   # 9 AM - 5 PM (standard work hours)
            end: 17
      deployment:
        type: fixed
        positions: [[4, 4]]

    # ... (repeat for all 14 affordances)

  # --------------------------------------------------------------------------
  # Modulation Parameters (how bars affect affordance effectiveness)
  # --------------------------------------------------------------------------
  # Must implement ALL modulations from environment.yaml modulation_graph
  modulations:
    - bar: energy
      affordances: [WORK]
      type: linear_multiplier
      threshold: 0.3  # Below 30% energy, work effectiveness drops
      min_multiplier: 0.5  # At 0% energy, only 50% effective

    - bar: mood
      affordances: [SOCIALIZE, WORK]
      type: linear_multiplier
      threshold: 0.4
      min_multiplier: 0.7

# =============================================================================
# SECTION 9: training.yaml (Runtime Orchestration)
# =============================================================================
# Location: configs/my_experiment/levels/<level>/training.yaml
# Purpose: Controls training process and runtime behavior.
# Tags: NON-BREAKING (hyperparameters only; dims set elsewhere).

training:
  version: "1.0"

  # ---------------------------------------------------------------------------
  # [CONFIG] Population Settings
  # [TAGS]   NON-BREAKING
  # ---------------------------------------------------------------------------
  population:
    size: 512  # Number of parallel agents

  # ---------------------------------------------------------------------------
  # [CONFIG] Affordance Deployment Controls
  # [TAGS]   NON-BREAKING
  # ---------------------------------------------------------------------------
  enabled_affordances: []         # [] = deploy no affordances; provide explicit list to deploy selected affordances (no implicit "all")
  randomize_affordances: false    # true = randomize positions each episode; false = use configured positions/optimization data

  # ---------------------------------------------------------------------------
  # [CONFIG] Curriculum-Level Action Control (optional)
  # [TAGS]   NON-BREAKING
  # ---------------------------------------------------------------------------
  # Enables actions with enabled_by_default: false in actions.yaml for this level.
  # Cannot disable actions with enabled_by_default: true.
  enabled_actions:
    custom:
      - REST       # Enable REST action for this level
      - MEDITATE   # Enable MEDITATE action for this level
  # If omitted, only enabled_by_default: true actions are available

  # ---------------------------------------------------------------------------
  # [CONFIG] Q-Learning Hyperparameters (overrides)
  # [TAGS]   NON-BREAKING
  # ---------------------------------------------------------------------------
  # Override agent.yaml brain settings for this curriculum level.
  q_learning:
    use_double_dqn: true      # Enable Double DQN for this level
    gamma: 0.99               # Discount factor
    learning_rate: 0.0001     # Adam learning rate
    target_update_frequency: 1000  # Update target network every N steps

  # ---------------------------------------------------------------------------
  # [CONFIG] Replay Buffer
  # [TAGS]   NON-BREAKING
  # ---------------------------------------------------------------------------
  replay_buffer:
    capacity: 100000
    batch_size: 256
    min_size: 1000  # Start training after N transitions

  # ---------------------------------------------------------------------------
  # [CONFIG] Exploration (epsilon-greedy)
  # [TAGS]   NON-BREAKING
  # ---------------------------------------------------------------------------
  exploration:
    epsilon_start: 1.0
    epsilon_end: 0.01
    epsilon_decay: 0.995

  # ---------------------------------------------------------------------------
  # [CONFIG] Intrinsic Exploration (if using adaptive_rnd)
  # [TAGS]   NON-BREAKING
  # ---------------------------------------------------------------------------
  intrinsic:
    rnd:
      feature_dim: 128
      learning_rate: 0.0001

    annealing:
      threshold: 100.0   # Survivors metric threshold
      decay_rate: 0.995
      min_weight: 0.01
    initial_weight: 0.1
    min_survival_fraction: 0.5
    survival_window: 100

  # ---------------------------------------------------------------------------
  # [CONFIG] Training Loop
  # [TAGS]   NON-BREAKING
  # ---------------------------------------------------------------------------
  training_loop:
    max_episodes: 100000
    max_steps_per_episode: 1000
    train_frequency: 4
    sequence_length: 8
    max_grad_norm: 10.0

    evaluation:
      interval: 1000  # Evaluate every N episodes
      num_episodes: 10

    checkpointing:
      interval: 5000  # Save checkpoint every N episodes
      keep_last: 5    # Keep last 5 checkpoints

  # ---------------------------------------------------------------------------
  # [CONFIG] Curriculum Progression (strategy)
  # [TAGS]   NON-BREAKING
  # ---------------------------------------------------------------------------
  curriculum:
    strategy: static  # Options: static, adversarial

    # Adversarial curriculum settings (when strategy: adversarial)
    adversarial:
      difficulty_metric: survival_rate
      adaptation_rate: 0.1
      min_difficulty: 0.2
      max_difficulty: 1.0
      survival_advance_threshold: 0.7
      survival_retreat_threshold: 0.3
      entropy_gate: 0.5
      min_steps_at_stage: 1000

# =============================================================================
# COMPUTED OBSERVATION DIMENSIONS (for reference)
# =============================================================================
# This section shows what obs_dim would be for this complete config.
# The compiler calculates this automatically - shown here for documentation.
#
# Given:
# - vision_support: both
# - temporal_support: enabled
# - 8 meters
# - 14 affordances
# - 4 VFS variables
# - Grid2D substrate (2 position dims)
# - Grid2D velocity (2 dims)
#
# Calculation:
# grid_encoding:   64 dims (8×8 grid)
# local_window:    25 dims (5×5 window with vision_range=0.5)
# position:         2 dims (x, y)
# velocity:         2 dims (dx, dy)
# meters:           8 dims (1 per meter)
# affordances:     14 dims (1 per affordance, binary visibility)
# vfs_variables:    4 dims (1 per variable)
# temporal:         4 dims (time_sin, time_cos, day_progress, is_night)
#
# TOTAL obs_dim: 123 dims
#
# With curriculum masking:
# L1 (active_vision: global, active_temporal: false):
#   - grid_encoding: ACTIVE (64 dims)
#   - local_window: MASKED (25 dims of zeros)
#   - temporal: MASKED (4 dims of zeros)
#   - obs_dim: 123 (same as L2, enabling checkpoint transfer!)
#
# L2 (active_vision: partial, active_temporal: false):
#   - grid_encoding: MASKED (64 dims of zeros)
#   - local_window: ACTIVE (25 dims)
#   - temporal: MASKED (4 dims of zeros)
#   - obs_dim: 123 (same as L1!)
#
# L3 (active_vision: global, active_temporal: true):
#   - grid_encoding: ACTIVE (64 dims)
#   - local_window: MASKED (25 dims of zeros)
#   - temporal: ACTIVE (4 dims)
#   - obs_dim: 123 (same as L1 and L2!)

# =============================================================================
# BREAKING vs NON-BREAKING SUMMARY
# =============================================================================
# Use this checklist to determine if a config change breaks checkpoints:
#
# BREAKING (changes obs_dim or action_dim):
# ✅ substrate.type, substrate.grid.width/height (affects grid_encoding size)
# ✅ vision_support (affects which vision fields exist)
# ✅ temporal_support (affects whether temporal fields exist)
# ✅ meters (adding/removing changes obs_dim)
# ✅ affordances (adding/removing changes obs_dim)
# ✅ vfs profiles/variables (adding/removing changes obs_dim)
# ✅ actions (adding/removing changes action_dim)
#
# NOT BREAKING (behavior only):
# ❌ substrate.boundary, distance_metric, observation_encoding (same dims, different values)
# ❌ active_vision, active_temporal (masking doesn't change dims)
# ❌ vision_range, day_length (parameters, not structure)
# ❌ meter parameters (depletion, recovery, bounds)
# ❌ cascade parameters (threshold, strength)
# ❌ affordance parameters (costs, effects, opening_hours)
# ❌ training hyperparameters (learning_rate, gamma, etc.)
# ❌ drive configuration (reward function)
# ❌ cues, labels, metadata

# =============================================================================
# SECTION 10: vfs_profiles.yaml (Dynamic Variable Definitions)
# =============================================================================
# Location: configs/my_experiment/vfs_profiles.yaml
# Purpose: Defines dynamic VFS profiles (Global, Agent, Item) using expressions.
# Tags: [BREAKING], [OBS_DIM] (exposed_to changes obs_dim).
# Source: 2025-11-18-items-and-vfs-profiles.md

vfs_profiles:
  version: "1.0"

  # GLOBAL SCOPE (World state)
  global:
    - id: is_night
      type: bool
      expression: "time_of_day >= 20 || time_of_day < 6"
      observation:
        exposed_to: [agent]  # Adds 1 dim to observation
        semantic_type: temporal

  # AGENT SCOPE (Per-agent state)
  agent:
    - id: is_encumbered
      type: bool
      expression: "vfs.inventory_weight > 10.0"
      observation:
        exposed_to: [agent]

    - id: nearest_food_dist
      type: scalar
      expression: "distance_to_nearest(item_tag='food')"
      observation:
        exposed_to: [agent]

  # ITEM SCOPE (Per-item state)
  item:
    - id: freshness
      type: scalar
      initial_value: 1.0  # Default if not spawned with explicit state
      observation:
        exposed_to: [agent] # Visible when item is held or inspected

    - id: calories
      type: scalar
      initial_value: 0.0

# =============================================================================
# SECTION 11: items.yaml (Item Catalog & Appearance)
# =============================================================================
# Location:
#   1) Catalog:   configs/my_experiment/items.yaml
#   2) Appearance: configs/my_experiment/levels/<level>/items.yaml
# Purpose: Defines Item Types (catalog) and Spawning/Inventory (appearance).
# Tags: [BREAKING] when catalog introduces new profiles (obs_dim impact).
# Source: 2025-11-18-items-and-vfs-profiles.md

# --- PART A: EXPERIMENT-LEVEL CATALOG ---
items:
  version: "1.0"

  item_types:
    - id: apple
      name: "Red Apple"
      icon: "🍎"
      tags: [food, perishable]
      vfs_profiles: [freshness, calories]  # Links to Section 10
      interactions:
        pickup:
          commands:
            - modify: target.vfs.inventory_weight
              value: target.vfs.inventory_weight + 0.5
        use:
          commands:
            - spawn_effect:
                effect_id: ate_food
                target: agent
                intensity: self.vfs.calories
            - delete: self

# --- PART B: LEVEL-LEVEL APPEARANCE ---
# (Inside configs/my_experiment/levels/<level>/items.yaml)
items:
  inventory:
    max_items_per_agent: 3  # HARD CAP. Adds GET/DROP/USE to action space.

  spawn_rules:
    - type_id: apple
      placement:
        mode: random
      schedule:
        kind: poisson
        params: { rate: 0.1 }
      limits:
        max_simultaneous: 5
      lifecycle:
        duration_steps: 100
      initial_state:
        calories: 50.0   # Overrides default from VFS profile

# =============================================================================
# SECTION 12: effects.yaml (Reusable Effect Catalog)
# =============================================================================
# Location: configs/my_experiment/effects.yaml
# Purpose: Defines reusable behavioral pipelines (Effects).
# Tags: NON-BREAKING (logic only; dims unaffected).
# Source: 2025-11-19-effects-system-design.md

effects:
  version: "1.0"

  effect_definitions:
    - id: ate_food
      scope: agent
      duration: 10
      reapply_policy: stack  # Options: stack, renew, merge, replace
      observable: true       # Agent sees "ate_food: true" in VFS obs

      on_spawn:
        - modify: target.vfs.is_digesting
          value: true

      on_tick:
        - modify: target.bar.energy
          value: target.bar.energy + (0.05 * intensity)

      on_despawn:
        - modify: target.vfs.is_digesting
          value: false

# =============================================================================
# END OF REFERENCE CONFIG
# =============================================================================
