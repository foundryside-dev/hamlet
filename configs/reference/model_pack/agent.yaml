agent:
  version: "1.0"

  perception: {}

  drive:
    version: "1.0"
    modifiers:
      energy_crisis:
        type: range_multiplier
        source: energy
        ranges:
          - min: 0.0
            max: 0.2
            multiplier: 0.0
          - min: 0.2
            max: 1.0
            multiplier: 1.0
    extrinsic:
      type: constant_base_with_shaped_bonus
      base: 0.01
      bonuses:
        - bar: energy
          weight: 0.5
          transform: linear
        - bar: health
          weight: 0.5
          transform: linear
    intrinsic:
      strategy: adaptive_rnd
      base_weight: 0.1
      apply_modifiers: [energy_crisis]
      annealing:
        enabled: true
        threshold: 50.0
        decay_rate: 0.995
        min_weight: 0.01
    shaping:
      - type: approach_reward
        target: EAT
        weight: 0.01
    composition:
      normalize: false
      clip: null
      log_components: false
      log_modifiers: false

  brain:
    architecture: feedforward
    feedforward:
      hidden_sizes: [128, 64]
      activation: relu
    recurrent:
      vision_encoder:
        conv_channels: [16, 32]
        kernel_size: 3
        stride: 1
        output_dim: 64
      position_encoder:
        hidden_size: 16
      meter_encoder:
        hidden_size: 16
      lstm:
        hidden_size: 128
        num_layers: 1
      q_head:
        hidden_sizes: [64]
    optimizer:
      type: adam
      learning_rate: 0.0001
      adam_beta1: 0.9
      adam_beta2: 0.999
      adam_eps: 1.0e-8
      weight_decay: 0.0
      schedule:
        type: constant
    q_learning:
      algorithm: double_dqn
      gamma: 0.99
      target_update_frequency: 1000
    loss:
      type: smooth_l1
      huber_delta: 1.0
