version: "1.0"

effect_definitions:
  - id: ate_food
    scope: agent
    duration: 10
    intensity: 1.0
    reapply_policy: stack
    observable: true
    on_spawn:
      - modify: target.vfs.is_digesting
        value: "true"
    on_tick:
      - modify: target.bar.energy
        value: target.bar.energy + (0.05 * intensity)
    on_despawn:
      - modify: target.vfs.is_digesting
        value: "false"

# Per-scope budget of concurrently active effects (token-obs spec S2, required because
# effects are declared). Values: one active instance per declared effect per scope
# entity; a `stack`-policy effect exceeding its scope budget raises loudly at publish.
max_active_effects:
  global: 0
  agent: 1
  item: 0
  affordance: 0
