version: "1.0"

effect_definitions:
  - id: ate_food
    scope: agent
    duration: 10
    reapply_policy: stack
    observable: true
    on_spawn:
      - modify: is_digesting
        value: "true"
    on_tick:
      - modify: bar.energy
        value: bar.energy + (0.05 * intensity)
    on_despawn:
      - modify: is_digesting
        value: "false"
    on_interrupt: []

# Per-scope budget of concurrently active effects (token-obs spec S2, required because
# effects are declared). Values: instances one scope entity may carry at once; a spawn
# beyond it (here, a second `stack` of ate_food on one agent) is refused in that world and
# recorded in the step's `effect_spawn_refusals`.
max_active_effects:
  global: 0
  agent: 1
  item: 0
  affordance: 0
