environment:
  version: "1.0"

  meters:
    - name: energy
      description: "Energy for actions"
      range_type:
        kind: minmax
        clip: true
    - name: health
      description: "Health state"
      range_type:
        kind: minmax
        clip: true
    - name: mood
      description: "Mood state"
      range_type:
        kind: minmax
        clip: true

  cascade_graph:
    - source: energy
      target: health
      description: "Energy loss harms health"
    - source: mood
      target: energy
      description: "Low mood reduces energy"

  modulation_graph: []

  affordances:
    - name: EAT
    - name: SLEEP
    - name: WORK
