stratum:
  version: "1.0"

  substrate:
    type: grid
    grid:
      width: 6
      height: 6
      topology: square
      diagonals: true
      boundary: clamp
      distance_metric: manhattan

  vision_support: both  # global + partial allocated
  temporal_support: enabled
  observation_mode:
    mode: full_auto  # full_auto | max_compact | full_manual (manual requires include_fields)
