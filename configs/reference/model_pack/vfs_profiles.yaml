version: "1.0"
evaluation_mode: mark_and_sweep
debug_logging: false

global_profile:
  variables:
    - name: is_night
      semantic_type: temporal
      type: float
      expression: "0.0"  # placeholder; no deps

agent_profile:
  variables:
    - name: inventory_weight
      semantic_type: custom
      type: float
      initial_value: 0.0
    - name: is_encumbered
      semantic_type: custom
      type: bool
      expression: "inventory_weight > 1.0"
    - name: is_digesting
      semantic_type: custom
      type: bool
      initial_value: false

item_profiles:
  - profile_name: default_item
    variables:
      - name: freshness
        type: float
        initial_value: 1.0
      - name: calories
        type: float
        initial_value: 10.0
