affordances:
  version: '1.0'
  affordances:
  - name: Bed
    interaction_type: instant
    costs:
      energy: 0.0
      money: 0.05
    opening_hours:
      enabled: false
    deployment:
      type: fixed
      positions:
      - - 1
        - 1
    interactions:
      on_start:
      - modify: bar.energy
        value: bar.energy + 0.5
      - modify: bar.health
        value: bar.health + 0.02
      per_tick: []
      on_completion: []
      on_early_exit: []
      on_failure: []
  - name: Hospital
    interaction_type: instant
    costs:
      money: 0.15
    opening_hours:
      enabled: false
    deployment:
      type: fixed
      positions:
      - - 2
        - 2
    interactions:
      on_start:
      - modify: bar.health
        value: bar.health + 0.4
      per_tick: []
      on_completion: []
      on_early_exit: []
      on_failure: []
  - name: Job
    interaction_type: instant
    costs: {}
    opening_hours:
      enabled: true
      schedule:
      - start: 8
        end: 18
    deployment:
      type: fixed
      positions:
      - - 3
        - 3
    interactions:
      on_start:
      - modify: bar.money
        value: bar.money + 0.28
      - modify: bar.energy
        value: bar.energy + -0.15
      per_tick: []
      on_completion: []
      on_early_exit: []
      on_failure: []
  - name: Bar
    interaction_type: instant
    costs:
      money: 0.15
    opening_hours:
      enabled: true
      schedule:
      - start: 18
        end: 28
    deployment:
      type: fixed
      positions:
      - - 4
        - 4
    interactions:
      on_start:
      - modify: bar.social
        value: bar.social + 0.5
      - modify: bar.mood
        value: bar.mood + 0.25
      - modify: bar.health
        value: bar.health + -0.05
      per_tick: []
      on_completion: []
      on_early_exit: []
      on_failure: []
  - name: Park
    interaction_type: instant
    costs: {}
    opening_hours:
      enabled: false
    deployment:
      type: fixed
      positions:
      - - 5
        - 5
    interactions:
      on_start:
      - modify: bar.social
        value: bar.social + 0.1
      - modify: bar.fitness
        value: bar.fitness + 0.05
      - modify: bar.mood
        value: bar.mood + 0.05
      per_tick: []
      on_completion: []
      on_early_exit: []
      on_failure: []
  modulations: []
