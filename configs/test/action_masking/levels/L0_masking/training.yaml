training:
  version: '1.0'
  population:
    size: 4
  enabled_affordances:
  - Bed
  - Hospital
  - Job
  - Bar
  - Park
  randomize_affordances: false
  enabled_actions: null
  q_learning:
    use_double_dqn: true
    gamma: 0.99
    learning_rate: 0.0005
    target_update_frequency: 200
  replay_buffer:
    capacity: 1000
    batch_size: 32
    min_size: 64
  exploration:
    epsilon_start: 1.0
    epsilon_end: 0.1
    epsilon_decay: 0.95
  intrinsic:
    rnd:
      feature_dim: 32
      learning_rate: 0.0005
      batch_size: 32
      normalization:
        initial_count: 100
        min_variance: 0.01
        reward_clip_max: 5.0
    annealing:
      threshold: 0.3
      decay_rate: 0.99
      min_weight: 0.01
      use_coefficient_of_variation: true
      hysteresis_cooldown: 100
    initial_weight: 0.0
    min_survival_fraction: 0.3
    survival_window: 10
  training_loop:
    max_episodes: 10
    max_steps_per_episode: 50
    train_frequency: 4
    sequence_length: 4
    max_grad_norm: 5.0
    evaluation:
      interval: 5
      num_episodes: 1
    checkpointing:
      interval: 10
      keep_last: 1
  curriculum:
    strategy: static
    adversarial: null
