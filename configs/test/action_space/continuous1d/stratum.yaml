stratum:
  version: "1.0"
  substrate:
    type: continuous
    continuous:
      dimensions: 1
      bounds:
        - [0.0, 10.0]
      boundary: clamp
      movement_delta: 0.5
      interaction_radius: 1.0
      distance_metric: euclidean
      action_discretization:
        num_directions: 8
        num_magnitudes: 3
  vision_support: global
  temporal_support: disabled
  observation_mode:
    mode: full_auto
