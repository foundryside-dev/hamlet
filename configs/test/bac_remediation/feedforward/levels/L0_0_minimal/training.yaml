run_metadata:
  output_subdir: L0_0_minimal
training:
  version: '1.0'
  seed: 42
  population:
    size: 8
  enabled_affordances:
  - EAT
  - SLEEP
  - SHOWER
  - EXERCISE
  - WORK
  - SOCIALIZE
  - MEDITATE
  - DRINK_WATER
  - BRUSH_TEETH
  - LAUNDRY
  - COOK
  - CLEAN_HOUSE
  - ENTERTAINMENT
  - DOCTOR
  randomize_affordances: true
  enabled_actions:
    custom:
    - REST
  q_learning:
    use_double_dqn: false
    gamma: 0.99
    learning_rate: 0.0001
    target_update_frequency: 500
  replay_buffer:
    capacity: 100000
    batch_size: 32
    min_size: 1000
  exploration:
    epsilon_start: 1.0
    epsilon_end: 0.01
    epsilon_decay: 0.995
  intrinsic:
    rnd:
      feature_dim: 128
      learning_rate: 0.0001
    annealing:
      threshold: 100.0
      decay_rate: 0.995
      min_weight: 0.001
    initial_weight: 1.0
    min_survival_fraction: 0.4
    survival_window: 100
  training_loop:
    max_episodes: 10000
    max_steps_per_episode: 1000
    train_frequency: 4
    sequence_length: 8
    max_grad_norm: 10.0
    checkpointing:
      interval: 1000
  curriculum:
    strategy: static
    adversarial:
      difficulty_metric: survival_rate
      adaptation_rate: 0.1
      min_difficulty: 0.2
      max_difficulty: 1.0
      survival_advance_threshold: 0.7
      survival_retreat_threshold: 0.3
      entropy_gate: 0.5
      min_steps_at_stage: 1000
  bac_options:
    replay:
      sampling_mode: successive_without_replacement
      uniform_sequence_adapter: legacy_episode_length_with_replacement
      sequence_mode: fixed_full
      retention_mode: whole_episode
      sequence_objective: window_mean
      priority_reduction: max_abs
    rnd:
      service_mode: paced_fifo
      max_updates_per_tick: 1
      max_pending_rows: 64
      overflow_policy: service_before_admit
    curriculum:
      commit_mode: completion
      difficulty_mode: stage_band
    serving:
      policy_mode: greedy_eval
    checkpoint:
      save_initial: false
      save_final: true
    provider_parameter_source: training
    evaluation:
      seed: 42
      episode_cap: 500
      epsilon: 0.0
      curriculum_state_policy: fresh
      reward_metric: extrinsic
