agent:
  version: "1.0"

  perception:

  drive:
    version: "1.0"

    modifiers:
      neutral:
        type: range_multiplier
        source: energy
        ranges:
          - min: 0.0
            max: 1.0
            multiplier: 1.0

    extrinsic:
      type: constant_base_with_shaped_bonus
      base: 0.01
      bonuses:
        - bar: energy
          weight: 0.5
          transform: linear
        - bar: health
          weight: 0.5
          transform: linear

    intrinsic:
      strategy: none
      base_weight: 0.0
      apply_modifiers: []

    shaping:
      - type: approach_reward
        target: BED
        weight: 0.01
        max_distance: 5.0

    composition:
      normalize: false
      clip: null
      log_components: false
      log_modifiers: false

  brain:
    architecture: feedforward

    feedforward:
      hidden_sizes: [64, 32]
      activation: relu

    recurrent:
      vision_encoder:
        conv_channels: [16]
        kernel_size: 3
        stride: 1
        output_dim: 32
      position_encoder:
        hidden_size: 16
      meter_encoder:
        hidden_size: 16
      lstm:
        hidden_size: 32
        num_layers: 1
      q_head:
        hidden_sizes: [32]

    optimizer:
      type: adam
      learning_rate: 0.001
      adam_beta1: 0.9
      adam_beta2: 0.999
      adam_eps: 1.0e-8
      weight_decay: 0.0
      schedule:
        type: constant

    q_learning:
      algorithm: double_dqn
      gamma: 0.99
      target_update_frequency: 100

    loss:
      type: smooth_l1
