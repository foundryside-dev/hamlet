stratum:
  version: "1.0"

  substrate:
    type: gridnd

    gridnd:
      dimension_sizes: [5, 5, 5, 5]
      boundary: clamp
      distance_metric: manhattan
      observation_encoding: relative
      topology: hypercube

  vision_support: global
  temporal_support: disabled
  observation_mode:
    mode: full_auto
