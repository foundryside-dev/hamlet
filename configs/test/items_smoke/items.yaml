items:
  version: '1.0'
  item_types:
  - id: apple
    exclusive: true
    vfs_profile: food
    description: Restores energy when used
    duration: null
    cooldown: null
    interactions:
      on_pickup: []
      on_use:
      - modify: bar.energy
        value: bar.energy + 0.3
      on_drop: []
    name: Apple
    icon: "\U0001F34E"
    tags:
    - apple
  - id: medkit
    exclusive: true
    vfs_profile: medical
    description: Restores health when used
    duration: 100
    cooldown: 50
    interactions:
      on_pickup: []
      on_use:
      - modify: bar.health
        value: bar.health + 0.5
      - modify: item.durability
        value: item.durability - 10
      on_drop: []
    name: Medkit
    icon: "\U0001F48A"
    tags:
    - medkit
  - id: coin
    exclusive: true
    vfs_profile: currency
    description: Adds money when picked up
    duration: null
    cooldown: null
    interactions:
      on_pickup:
      - modify: bar.money
        value: bar.money + 0.1
      on_use: []
      on_drop: []
    name: Coin
    icon: "\U0001FA99"
    tags:
    - coin
  max_items_per_agent: 3
  max_items_in_world: 10
