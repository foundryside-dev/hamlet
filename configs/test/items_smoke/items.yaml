items:
  version: "1.0"

  item_types:
    - id: apple
      vfs_profile: food
      description: "Restores energy when used"
      duration: null  # Permanent
      cooldown: null
      interactions:
        on_pickup: []  # No VFS variables available yet
        on_use:
          - modify: "target.bar.energy"
            value: "target.bar.energy + 0.3"
        on_drop: []

    - id: medkit
      vfs_profile: medical
      description: "Restores health when used"
      duration: 100  # Despawns after 100 ticks
      cooldown: 50   # Can't respawn for 50 ticks after despawn
      interactions:
        on_pickup: []
        on_use:
          - modify: "target.bar.health"
            value: "target.bar.health + 0.5"
        on_drop: []

    - id: coin
      vfs_profile: currency
      description: "Adds money when picked up"
      duration: null
      cooldown: null
      interactions:
        on_pickup:
          - modify: "target.bar.money"
            value: "target.bar.money + 0.1"  # 10 out of max 100 = 0.1 in normalized space
        on_use: []
        on_drop: []

  max_items_per_agent: 3
  max_items_in_world: 10
