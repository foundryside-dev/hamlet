# Items Appearance (Level-Specific Spawn Rules)

version: "1.0"

items:
  - item_type: apple
    spawn_count: 3       # Spawn 3 apples at level start
    spawn_interval: 100  # Respawn every 100 ticks
    spawn_position: random

  - item_type: medkit
    spawn_count: 1
    spawn_interval: 200
    spawn_position: random

  - item_type: energy_drink
    spawn_count: 2
    spawn_interval: 150
    spawn_position: random
