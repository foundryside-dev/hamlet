training:
  version: "1.0"
  seed: 42

  # === Q-LEARNING ALGORITHM ===
  use_double_dqn: false
  gamma: 0.99
  learning_rate: 0.001
  target_update_frequency: 100

  # === REPLAY BUFFER ===
  replay_buffer_capacity: 1000
  batch_size: 32

  # === EXPLORATION ===
  epsilon_start: 1.0
  epsilon_end: 0.1
  epsilon_decay_steps: 1000

  # === TRAINING LOOP ===
  max_steps: 5000
  steps_per_epoch: 100
  steps_before_training: 100
  steps_before_target_update: 100

  # === GRADIENT ===
  gradient_clip_max_norm: 10.0

  # === EPISODE ===
  max_episode_length: 100
