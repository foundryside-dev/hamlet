version: "1.0"
variables:
  - id: position
    scope: agent
    type: vec2f
    dims: 2
    default: [0.0, 0.0]
    lifetime: tick
    readable_by: [agent, engine]
    writable_by: [engine]
    description: Normalized agent position in [0, 1]^2 range
    normalization:
      method: normalize
      range: [0.0, 1.0]

  - id: has_food
    scope: agent
    type: bool
    default: false
    lifetime: tick
    readable_by: [agent, engine]
    writable_by: [engine, actions, bac]
    description: "Agent has picked up food (set by on_pickup Effects)"

  # Item-scoped variables (per-item state)
  - id: durability
    scope: item
    type: scalar
    default: 100.0
    lifetime: persistent
    readable_by: [agent, engine]
    writable_by: [actions, engine]
    description: "Item durability (0-100). Decreases on use."
    normalization:
      method: normalize
      range: [0.0, 100.0]

  - id: freshness
    scope: item
    type: scalar
    default: 100.0
    lifetime: persistent
    readable_by: [agent, engine]
    writable_by: [engine]
    description: "Item freshness (0-100). Decreases over time for perishables."
    normalization:
      method: normalize
      range: [0.0, 100.0]

  - id: charges
    scope: item
    type: scalar
    default: 3.0
    lifetime: persistent
    readable_by: [agent, engine]
    writable_by: [actions, engine]
    description: "Number of uses remaining for consumables."
    normalization:
      method: normalize
      range: [0.0, 10.0]

exposed_observations:
  - id: obs_position
    shape: [2]
    type: vec2f
    source: position
    scope: agent
    normalization:
      min: [0.0, 0.0]
      max: [1.0, 1.0]
