version: "1.0"
evaluation_mode: mark_and_sweep
debug_logging: false

global_profile: null
agent_profile: null

item_profiles:
  - profile_name: food
    variables:
      - name: freshness
        type: float
        initial_value: 100.0

  - profile_name: medical
    variables:
      - name: durability
        type: float
        initial_value: 100.0
        exposed_to: [agent]
        normalization:
          kind: minmax
          min: 0.0
          max: 100.0
          clip: true

  - profile_name: currency
    variables: []
