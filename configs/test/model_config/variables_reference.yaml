version: '1.0'
variables:
- id: position
  scope: agent
  type: vecNf
  dims: 2
  default:
  - 0.0
  - 0.0
  lifetime: tick
  readable_by:
  - agent
  - engine
  writable_by:
  - engine
  description: Normalized agent position (2D) in [0, 1]^2 range
  normalization:
    kind: minmax
    min:
    - 0.0
    - 0.0
    max:
    - 1.0
    - 1.0

- id: time_sin
  scope: global
  type: scalar
  default: 0.0
  lifetime: tick
  readable_by:
  - agent
  - engine
  writable_by:
  - engine
  description: Sine component of time of day (24h cycle)

- id: time_cos
  scope: global
  type: scalar
  default: 1.0
  lifetime: tick
  readable_by:
  - agent
  - engine
  writable_by:
  - engine
  description: Cosine component of time of day (24h cycle)

exposed_observations:
- id: obs_position
  shape:
  - 2
  type: vecNf
  source: position
  scope: agent
  normalization:
    kind: minmax
    min:
    - 0.0
    - 0.0
    max:
    - 1.0
    - 1.0
