environment:
  version: "1.0"

  meters:
    - name: energy
      description: "Physical energy for movement and actions"
      range_type:
        kind: minmax
        clip: true

    - name: health
      description: "Physical health, death at 0"
      range_type:
        kind: minmax
        clip: true

    - name: money
      description: "Economic resource for purchasing"
      range_type:
        kind: minmax
        clip: true

    - name: mood
      description: "Mental state, affects energy cascade"
      range_type:
        kind: minmax
        clip: true

  cascade_graph:
    - source: mood
      target: energy
      description: "Low mood drains energy"

  modulation_graph:
    - bar: energy
      affordances: [WORK]
      description: "Low energy reduces work effectiveness"

    - bar: mood
      affordances: [SOCIALIZE, WORK]
      description: "Low mood reduces social and work quality"

  affordances:
    - name: EAT
    - name: SLEEP
    - name: SHOWER
    - name: EXERCISE
    - name: WORK
    - name: SOCIALIZE
    - name: MEDITATE
    - name: DRINK_WATER
    - name: BRUSH_TEETH
    - name: LAUNDRY
    - name: COOK
    - name: CLEAN_HOUSE
    - name: ENTERTAINMENT
    - name: DOCTOR
