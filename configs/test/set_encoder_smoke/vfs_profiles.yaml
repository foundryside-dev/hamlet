version: '1.0'
evaluation_mode: mark_and_sweep
debug_logging: false

agent_profile:
  variables:
    - name: need_tokens
      semantic_type: custom
      type: tensor2d
      shape: [4, 3]
      # The compiler losslessly lowers this deterministic mode to the sole explicit literal
      # default carried by variable_element identity; no mode/params reach token binding.
      initial_value_mode: zeros
      exposed_to: [agent]
      # Required at exposure (token-obs spec S2): token feature lanes live in [0, 1];
      # clipped minmax certifies boundedness.
      normalization:
        kind: minmax
        min: 0.0
        max: 1.0
        clip: true
      description: "Flattened token rows for the set-encoder proof: 4 tokens x 3 features."

item_profiles: []
