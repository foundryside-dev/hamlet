---
version: '1.0'
description: token-set smoke pack — the live token_set exerciser over the compiled TokenSpec (token-obs unit 3, hamlet-fa6bb6da4a)
architecture:
  type: token_set
  token_set:
    token_embed_dim: 16
    q_head_hidden_dim: 64
    aggregator:
      type: mean
optimizer:
  type: adam
  learning_rate: 0.0001
  weight_decay: 0.0
  schedule:
    type: constant
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_eps: 1.0e-08
loss:
  type: smooth_l1
q_learning:
  gamma: 0.99
  target_update_frequency: 1000
  use_double_dqn: true
replay:
  capacity: 100000
  prioritized: false
