variables:
  version: '1.0'
  evaluation_mode: mark_and_sweep
  debug_logging: false
  extents: {}
  item_profiles: []
  declarations:
  - id: deficit_energy
    readable_by: [engine, agent]
    writable_by: [engine]
    scope: agent
    type: scalar
    lifetime: tick
    semantic_type: custom
    exposed_to:
    - agent
    initial_value: 0.0
    normalization:
      kind: minmax
      min: 0.0
      max: 1.0
      clip: true
    description: How far below target energy (0.0 = at/above target)
  - id: time_since_last_eat
    readable_by: [engine, agent]
    writable_by: [engine]
    scope: agent
    type: scalar
    lifetime: tick
    semantic_type: custom
    exposed_to:
    - agent
    initial_value: 0.0
    normalization:
      kind: minmax
      min: 0.0
      max: 100.0
      clip: true
    description: Timesteps since last EAT action
  - id: need_tokens
    readable_by: [engine, agent]
    writable_by: [engine]
    scope: agent
    type: tensor2d
    lifetime: episode
    semantic_type: custom
    exposed_to:
    - agent
    initial_value_mode: zeros
    shape:
    - 4
    - 3
    normalization:
      kind: minmax
      min: 0.0
      max: 1.0
      clip: true
    description: 'Flattened variable-element token rows: 4 tokens x 3 features.'
  - id: position
    readable_by: [engine, agent]
    writable_by: [engine]
    scope: agent
    type: vecNf
    lifetime: tick
    semantic_type: custom
    exposed_to: []
    initial_value:
    - 0.0
    - 0.0
    description: Normalized agent position (2D) in [0, 1]^2 range
    dims: 2
