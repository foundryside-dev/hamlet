---
version: '1.0'
variables:
- id: position
  scope: agent
  type: vecNf
  dims: 2
  default:
  - 0.0
  - 0.0
  lifetime: tick
  readable_by:
  - agent
  - engine
  writable_by:
  - engine
  description: Normalized agent position (2D) in [0, 1]^2 range
  normalization:
    kind: minmax
    clip: false
    min:
    - 0.0
    - 0.0
    max:
    - 1.0
    - 1.0
exposed_observations:
- id: obs_position
  shape:
  - 2
  type: vecNf
  source: position
  scope: agent
  normalization:
    kind: minmax
    clip: false
    min:
    - 0.0
    - 0.0
    max:
    - 1.0
    - 1.0
