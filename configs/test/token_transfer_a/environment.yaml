environment:
  version: "1.0"

  meters:
    - name: energy
      description: Energy
      range_type:
        kind: minmax
        clip: true
    - name: health
      description: Health
      range_type:
        kind: minmax
        clip: true

  cascade_graph: []
  modulation_graph: []
  affordances:
    - name: BED
      description: Rest to recover energy
      category: rest
    - name: FOOD
      description: Eat food
      category: sustenance

  # The one roster member pack B lacks: an exposed variable whose declarations
  # SATISFY the exposure rules (bounded minmax with clip: true), so it binds a
  # variable_element slot in the compiled TokenSpec.
  variables:
    - name: threat_level
      type: scalar
      dims: 1
      scope: agent
      description: "Bounded scalar that binds a variable_element token slot"
      semantic_type: custom
      normalization:
        method: normalize
        clip: true
        range: [0.0, 1.0]

  cues: []
