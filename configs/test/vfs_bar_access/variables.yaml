variables:
  version: '1.0'
  evaluation_mode: eager
  debug_logging: false
  extents: {}
  item_profiles:
  - default_item
  declarations:
  - id: low_energy_flag
    scope: agent
    type: bool
    lifetime: episode
    semantic_type: custom
    exposed_to: []
    expression: bar.energy < 0.3
    initial_value: false
  - id: position
    scope: agent
    type: vec2f
    lifetime: tick
    semantic_type: custom
    exposed_to: []
    initial_value:
    - 0.0
    - 0.0
    description: Normalized agent position in [0, 1]^2 range
