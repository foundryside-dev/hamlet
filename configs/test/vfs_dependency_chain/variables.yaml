variables:
  version: '1.0'
  evaluation_mode: eager
  debug_logging: false
  extents: {}
  item_profiles:
  - default_item
  declarations:
  - id: a
    scope: global
    type: scalar
    lifetime: persistent
    semantic_type: custom
    exposed_to: []
    initial_value: 10.0
  - id: b
    scope: global
    type: scalar
    lifetime: persistent
    semantic_type: custom
    exposed_to: []
    expression: a + 5
    initial_value: 0.0
  - id: c
    scope: global
    type: scalar
    lifetime: persistent
    semantic_type: custom
    exposed_to: []
    expression: b * 2
    initial_value: 0.0
  - id: position
    scope: agent
    type: vec2f
    lifetime: tick
    semantic_type: custom
    exposed_to: []
    initial_value:
    - 0.0
    - 0.0
    description: Normalized agent position in [0, 1]^2 range
