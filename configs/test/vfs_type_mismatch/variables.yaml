variables:
  version: '1.0'
  item_profiles: []
  declarations:
  - id: my_int_var
    readable_by: [engine, agent]
    writable_by: [engine]
    scope: global
    type: scalar
    lifetime: persistent
    semantic_type: custom
    exposed_to: []
    expression: 10 < 5
    initial_value: 0.0
  - id: position
    readable_by: [engine, agent]
    writable_by: [engine]
    scope: agent
    type: vec2f
    lifetime: tick
    semantic_type: custom
    exposed_to: []
    initial_value:
    - 0.0
    - 0.0
    description: Normalized agent position in [0, 1]^2 range
