    opening_hours:
      enabled: false
    deployment:
      type: fixed
      positions:
      - [2, 2, 2, 2, 2]
    interactions:
      on_start:
      - modify: target.bar.biomass
        value: target.bar.biomass + 0.25
      per_tick: []
      on_completion: []
      on_early_exit: []
      on_failure: []
  modulations: []
