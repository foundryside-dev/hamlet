    interactions:
      on_start:
      # PRD-0001 Trial B (blind): the growth declaration below was the pack's
      # spread mechanism.  It compiles and validates, and is refused at runtime:
      #   ValueError: agent_positions and self_index required for position 'self'
      # The affordance engine's ExecutionContext sets self_index=None and never
      # sets agent_positions (affordance_engine.py:509-519), and effect on_spawn
      # / on_tick contexts get agent_positions=None too, so no config-declarable
      # path can resolve a spawn_item position.  Kept as a comment so the pack
      # stays runnable; the verbatim error is in the trial record.
      # - spawn_item: creep_cell
      #   position: self
      # The ONLY write the engine accepts against the organism container: it
      # sets EVERY cell at once.  Per-cell / adjacency-respecting propagation
      # is refused at compile time (see the trial record, B-F5).
      - modify: vfs.organism_cells
        value: "1.0"
      - modify: vfs.organism_size
        value: vfs.organism_size + 1
      per_tick: []
      on_completion: []
      on_early_exit: []
      on_failure: []
  - name: WAREHOUSE
    interaction_type: instant
