# Trial B (blind re-run) — the spreading organism.
# 5-D discrete landscape (B-F1): five live spatial dimensions.
stratum:
  version: "1.0"

  substrate:
    type: gridnd

    gridnd:
      dimension_sizes: [3, 3, 3, 3, 3]
      boundary: clamp
      distance_metric: manhattan
      observation_encoding: relative
      topology: hypercube

  vision_support: global
  temporal_support: disabled
  observation_mode:
    mode: full_auto
