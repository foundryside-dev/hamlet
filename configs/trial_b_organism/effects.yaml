version: "1.0"

effect_definitions:
  # THE ORGANISM's growth process. One instance rides each agent that joins by
  # touching the ROOT affordance at declared point A (spawn_effect attaches it
  # to the interacting agent). on_tick recomputes the organism's extent (count
  # of joined growth tips, as a fraction of world item capacity) into the
  # global organism_size variable; the recompute-from-zero shape makes it
  # idempotent across the per-agent instances.
  #
  # There is deliberately no creep plant here: EVERY declarative form of
  # spawn_item is refused — explicit coordinates at parse time (the effects
  # DTO types position as a string), and the string strategies
  # ("self"/"target"/"random") at runtime, because no production pipeline
  # passes agent positions. The probe records each refusal verbatim.
  - id: organism
    scope: agent
    duration: 100000
    reapply_policy: renew
    observable: true

    on_spawn: []

    on_tick:
      - modify: vfs.organism_size
        value: "0.0"
      - for_each: all_agents
        as: a
        do:
          # rooted == 1 means organism 1; rooted == 2 (contested level) must
          # not count here, hence the upper gate.
          - if: "target.bar.rooted >= 0.5"
            then:
              - if: "target.bar.rooted <= 1.5"
                then:
                  - modify: vfs.organism_size
                    value: "vfs.organism_size + 0.001"
                else: []
            else: []

    on_despawn: []
    on_interrupt: []

  # The SECOND organism's growth process (contested level, B3). Same shape,
  # counting members with rooted == 2 into organism2_size.
  - id: organism2
    scope: agent
    duration: 100000
    reapply_policy: renew
    observable: true

    on_spawn: []

    on_tick:
      - modify: vfs.organism2_size
        value: "0.0"
      - for_each: all_agents
        as: a
        do:
          - if: "target.bar.rooted >= 1.5"
            then:
              - modify: vfs.organism2_size
                value: "vfs.organism2_size + 0.001"
            else: []

    on_despawn: []
    on_interrupt: []

  # The deposit the Spec actually wants — the organism leaving a durable trail
  # under its moving growth tips. Declared here exactly as effects.md documents
  # (`spawn_item` with `position: self`), and it compiles; every reachable
  # runtime pipeline then refuses it loudly ("agent_positions and self_index
  # required"), because the one production call site
  # (vectorized_env.py step -> effect_manager.tick) never passes agent
  # positions, though the whole effects subsystem threads the parameter.
  # Never spawned by any affordance in this pack; the probe attaches it to a
  # throwaway env to record the refusal verbatim. See the trial record.
  - id: organism_footprint
    scope: agent
    duration: 100000
    reapply_policy: renew
    observable: true

    on_spawn: []

    on_tick:
      - spawn_item: creep
        position: self

    on_despawn: []
    on_interrupt: []

# Per-scope budget of concurrently active effects (token-obs spec S2, required because
# effects are declared). Values: one active instance per declared effect per scope
# entity; a `stack`-policy effect exceeding its scope budget raises loudly at publish.
max_active_effects:
  global: 0
  agent: 3
  item: 0
  affordance: 0
