bars:
  version: "1.0"
  meters:
    - name: energy
      initial: 0.5
      depletion:
        passive: 0.0
        move: 0.0
        interact: 0.0
      recovery:
        natural: 0.0
      bounds:
        min: 0.0
        max: 1.0
        lethal_min: true
        lethal_max: false

    - name: health
      initial: 1.0
      depletion:
        passive: 0.0
        move: 0.0
        interact: 0.0
      recovery:
        natural: 0.0
      bounds:
        min: 0.0
        max: 1.0
        lethal_min: true
        lethal_max: false

    # Organism membership flag: 0 until this agent touches the ROOT at A,
    # 1 forever after. Read by the standing `organism` effect to decide which
    # agents deposit creep. No passive dynamics.
    - name: rooted
      initial: 0.0
      depletion:
        passive: 0.0
        move: 0.0
        interact: 0.0
      recovery:
        natural: 0.0
      bounds:
        min: 0.0
        max: 1.0
        lethal_min: false
        lethal_max: false

    # Food absorbed at the WAREHOUSE. Only rooted agents absorb (the gate is in
    # the affordance's command pipeline). Drives the extrinsic reward.
    - name: biomass
      initial: 0.0
      depletion:
        passive: 0.0
        move: 0.0
        interact: 0.0
      recovery:
        natural: 0.0
      bounds:
        min: 0.0
        max: 1.0
        lethal_min: false
        lethal_max: false

  cascades: []
