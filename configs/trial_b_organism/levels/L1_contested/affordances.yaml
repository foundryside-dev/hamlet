affordances:
  version: '1.0'
  affordances:
  # Organism 1's root at A = [0,0,0,0,0]. Joining is EXCLUSIVE: an agent that
  # already belongs to either organism is refused (the gate on rooted < 0.5).
  - name: ROOT
    interaction_type: instant
    costs: {}
    opening_hours:
      enabled: false
    deployment:
      type: fixed
      positions:
      - - 0
        - 0
        - 0
        - 0
        - 0
    interactions:
      on_start:
      - if: "target.bar.rooted < 0.5"
        then:
        - modify: target.bar.rooted
          value: "1.0"
        - spawn_effect: organism
          target: "target"
          intensity: 1.0
        else: []
      per_tick: []
      on_completion: []
      on_early_exit: []
      on_failure: []
  # Organism 2's root at A2 = [3,3,0,0,0] — same exclusivity gate, sets 2.
  - name: ROOT2
    interaction_type: instant
    costs: {}
    opening_hours:
      enabled: false
    deployment:
      type: fixed
      positions:
      - - 3
        - 3
        - 0
        - 0
        - 0
    interactions:
      on_start:
      - if: "target.bar.rooted < 0.5"
        then:
        - modify: target.bar.rooted
          value: "2.0"
        - spawn_effect: organism2
          target: "target"
          intensity: 1.0
        else: []
      per_tick: []
      on_completion: []
      on_early_exit: []
      on_failure: []
  # The ONE food warehouse both organisms contest, at W = [3,3,3,3,3]. Any
  # joined agent absorbs, whichever organism it belongs to — the shared source.
  - name: WAREHOUSE
    interaction_type: instant
    costs: {}
    opening_hours:
      enabled: false
    deployment:
      type: fixed
      positions:
      - - 3
        - 3
        - 3
        - 3
        - 3
    interactions:
      on_start:
      - if: "target.bar.rooted >= 0.5"
        then:
        - modify: target.bar.biomass
          value: "target.bar.biomass + 0.2"
        else: []
      per_tick: []
      on_completion: []
      on_early_exit: []
      on_failure: []
  modulations: []
