stratum:
  version: "1.0"

  substrate:
    type: gridnd

    gridnd:
      dimension_sizes: [4, 4, 4, 4, 4]
      boundary: clamp
      distance_metric: manhattan
      observation_encoding: relative
      topology: hypercube

  vision_support: global
  temporal_support: enabled
  observation_mode:
    mode: full_auto
