version: "1.0"
evaluation_mode: mark_and_sweep
debug_logging: false

global_profile:
  variables:
    # The organism's extent, as the observation encodes it: the count of joined
    # growth tips as a fraction of world item capacity (+0.001 each, so the
    # encoded value stays in [0, 1] by construction). Recomputed from zero
    # every tick by the `organism` effect. This is extent CARDINALITY only —
    # the spatial layout of the organism is not encodable (see trial record,
    # facet 2).
    - name: organism_size
      semantic_type: custom
      type: float
      initial_value: 0.0
    # Second organism's extent, for the contested level (B3). Always 0 on
    # L0_organism, where nothing sets rooted to 2.
    - name: organism2_size
      semantic_type: custom
      type: float
      initial_value: 0.0

agent_profile: null

item_profiles:
  - profile_name: default_item
    variables: []
