environment:
  version: "1.0"

  meters:
    - name: energy
      description: Energy
      range_type:
        kind: minmax
        clip: false
    - name: health
      description: Health
      range_type:
        kind: minmax
        clip: false
    - name: rooted
      description: "1.0 once this agent has joined the organism by touching the root at A (0 = free-floating)"
      range_type:
        kind: minmax
        clip: false
    - name: biomass
      description: "Food absorbed from the warehouse by this growth tip"
      range_type:
        kind: minmax
        clip: false

  cascade_graph: []
  modulation_graph: []
  affordances:
    - name: ROOT
      description: "The organism's root at declared point A; touching it joins the agent to the organism"
      category: organism
    - name: WAREHOUSE
      description: "The food warehouse the organism must spread toward"
      category: organism

  variables: []
  cues: []
