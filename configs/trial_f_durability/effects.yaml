version: "1.0"

effect_definitions:
  # Energy regeneration (RENEW policy)
  - id: "energy_regen"
    scope: agent
    duration: 20
    intensity: 1.0
    reapply_policy: renew
    observable: true

    on_spawn: []

    on_tick:
      - modify: target.bar.energy
        value: "target.bar.energy + (0.05 * intensity)"

    on_despawn: []

  # Instant health boost (STACK policy)
  - id: "health_boost"
    scope: agent
    duration: 1
    intensity: 1.0
    reapply_policy: stack
    observable: true

    on_spawn:
      - modify: target.bar.health
        value: "target.bar.health + (0.2 * intensity)"

    on_tick: []

    on_despawn: []

  # Poison with merge policy
  - id: "poison"
    scope: agent
    duration: 20
    intensity: 1.0
    reapply_policy: merge
    observable: true

    on_spawn: []

    on_tick:
      - modify: target.bar.health
        value: "target.bar.health - (0.02 * intensity)"

    on_despawn: []

  # Buff with replace policy
  - id: "buff_replace"
    scope: agent
    duration: 15
    intensity: 1.0
    reapply_policy: replace
    observable: true

    on_spawn: []
    on_tick: []
    on_despawn: []
