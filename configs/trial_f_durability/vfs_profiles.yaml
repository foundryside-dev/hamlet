version: "1.0"
evaluation_mode: mark_and_sweep
debug_logging: false

global_profile:
  variables:
    - name: day_count
      semantic_type: custom
      type: int
      initial_value: 0

agent_profile: null

item_profiles:
  - profile_name: tool_stats
    variables:
      # The wear state (facet 1). Its old exposure targeted the obs_item_slots
      # observation block, which died at the unit-3 token cut; item-profile
      # exposure re-lands with the unit-5 pack migration (retired-corpus pack,
      # left unexposed rather than migrated early).
      - name: durability
        type: float
        initial_value: 3.0
        description: "Uses remaining (3.0 = new, 0.0 = broken)"
