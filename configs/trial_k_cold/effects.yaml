version: "1.0"

effect_definitions:
  # ── The winter process — the world acting on the agent ────────────────────
  #
  # F1 asks whether a WORLD variable can evolve under a declared rule with no
  # agent action as its cause. This effect's `on_tick` is engine-ticked once it
  # exists, so the *rule* is declarative. The open question the probe answers is
  # whether it can ever come into existence without an agent doing something —
  # cheat #2 rules an agent-caused world out.
  #
  # Deliberately declared with NO reset-time / ambient spawner, because none was
  # found to declare. The F1 probe runs all-WAIT and reads `winter_ticks`: if it
  # is still 0.0, the world never acted on its own.
  #
  # Scope note, inherited from Trial O (`hamlet-4cd664a955`): `scope: global` is
  # declarable but unreachable at spawn — every spawn path hardcodes agent
  # scope — so this is declared agent-scoped and pinned to slot 0.
  - id: "winter"
    scope: agent
    duration: 100000
    reapply_policy: renew
    observable: true

    on_spawn: []

    on_tick:
      # Witness that the world process actually executed this tick.
      - modify: vfs.winter_ticks
        value: "vfs.winter_ticks + 1.0"

      # The declared evolution rule: temperature falls 0.1/tick to a floor of
      # 0.0 and stays there. Boundary case 12 (world-variable saturation).
      - modify: vfs.season_clock
        value: "vfs.season_clock + 1.0"
      - if: "vfs.world_temp > 0.0"
        then:
          - modify: vfs.world_temp
            value: "vfs.world_temp - 0.1"
        else: []

      # F2 — the threshold gate. Cold below 0.5, not cold at or above it.
      # Boundary cases 1 (equality: `<` so 0.5 exactly is the WARM side) and
      # 2 (warm-side magnitude is exactly 0.0, not a residual).
      - if: "vfs.world_temp < 0.5"
        then:
          - for_each: all_agents
            as: a
            do:
              # F5 — how much of the incoming cold lands is modulated by the
              # insulation the wearer carries, which is declared on the item.
              # Boundary case 5 (over-mitigation): clamped at 0, never inverted
              # into a gain.
              - if: "1.0 - target.bar.insulation_worn > 0.0"
                then:
                  - modify: target.bar.cold_bite
                    value: "0.1 * (1.0 - target.bar.insulation_worn)"
                else:
                  - modify: target.bar.cold_bite
                    value: "0.0"
              - modify: target.bar.comfort
                value: "target.bar.comfort - target.bar.cold_bite"
        else:
          # Warm side: the pressure is ABSENT, exactly.
          - for_each: all_agents
            as: a
            do:
              - modify: target.bar.cold_bite
                value: "0.0"

    on_despawn: []
    on_interrupt: []

# Per-scope budget of concurrently active effects (token-obs spec S2, required because
# effects are declared). Values: one active instance per declared effect per scope
# entity; a `stack`-policy effect exceeding its scope budget raises loudly at publish.
max_active_effects:
  global: 0
  agent: 1
  item: 0
  affordance: 0
