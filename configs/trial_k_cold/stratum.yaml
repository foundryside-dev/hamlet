stratum:
  version: "1.0"

  substrate:
    type: grid

    grid:
      topology: square
      # 7x7 so an "indoor" region (x >= 5) is separable from an outdoor start
      # cell with several ticks of travel between them — F7 needs the crossing
      # tick to be unambiguous.
      width: 7
      height: 7
      boundary: clamp
      distance_metric: manhattan
      diagonals: false

  vision_support: global
  temporal_support: disabled
  observation_mode:
    mode: full_auto
