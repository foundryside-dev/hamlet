environment:
  version: "1.0"

  meters:
    - name: energy
      description: Energy
      range_type:
        kind: minmax
        clip: true
    - name: health
      description: Health
      range_type:
        kind: minmax
        clip: true
    - name: since_bed
      description: "Ticks since BED was last used (cooldown timer, advances 1/tick, reset on use)"
      range_type:
        kind: minmax
        clip: true
    - name: since_food
      description: "Ticks since FOOD was last used (cooldown timer, advances 1/tick, reset on use)"
