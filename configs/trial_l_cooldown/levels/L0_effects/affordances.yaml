affordances:
  version: '1.0'
  affordances:
  - name: BED
    interaction_type: instant
    costs: {}
    opening_hours:
      enabled: false
    deployment:
      type: fixed
      positions:
      - - 2
        - 2
    interactions:
      # Cooldown gate: the effect applies only when >= 10 ticks have elapsed
      # since last use; a use inside the window does nothing. The gate reads
      # the elapsed-time meter, not a spendable stock.
      on_start:
      - if: target.bar.since_bed >= 10.0
        then:
        - modify: target.bar.energy
          value: target.bar.energy + 0.1
        - modify: target.bar.since_bed
          value: "0.0"
        else: []
      per_tick: []
      on_completion: []
      on_early_exit: []
      on_failure: []
  - name: FOOD
    interaction_type: instant
    costs: {}
    opening_hours:
      enabled: false
    deployment:
      type: fixed
      positions:
      - - 3
        - 3
    interactions:
      # Independent cooldown: 4 ticks, own timer.
      on_start:
      - if: target.bar.since_food >= 4.0
        then:
        - modify: target.bar.energy
          value: target.bar.energy + 0.2
        - modify: target.bar.since_food
          value: "0.0"
        else: []
      per_tick: []
      on_completion: []
      on_early_exit: []
      on_failure: []
  modulations: []
