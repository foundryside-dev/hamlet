bars:
  version: "1.0"
  meters:
    - name: energy
      initial: 0.5
      depletion:
        passive: 0.0
        move: 0.0
        interact: 0.0
      recovery:
        natural: 0.0
      bounds:
        min: 0.0
        max: 1.0
        lethal_min: true
        lethal_max: false

    - name: health
      initial: 1.0
      depletion:
        passive: 0.0
        move: 0.0
        interact: 0.0
      recovery:
        natural: 0.0
      bounds:
        min: 0.0
        max: 1.0
        lethal_min: true
        lethal_max: false

    # Cooldown timer for BED: nothing spends it, time alone advances it
    # (declared negative passive drain = +1/tick; `recovery.natural` is NOT used
    # because the runtime consumes it nowhere — filed as an INERT gap by Trial L),
    # and a successful use resets it to 0 via the affordance's on_start commands.
    - name: since_bed
      initial: 1000.0
      depletion:
        passive: -1.0
        move: 0.0
        interact: 0.0
      recovery:
        natural: 0.0
      bounds:
        min: 0.0
        max: 1000.0
        lethal_min: false
        lethal_max: false

    # Cooldown timer for FOOD — independent of since_bed.
    - name: since_food
      initial: 1000.0
      depletion:
        passive: -1.0
        move: 0.0
        interact: 0.0
      recovery:
        natural: 0.0
      bounds:
        min: 0.0
        max: 1000.0
        lethal_min: false
        lethal_max: false

  cascades: []
