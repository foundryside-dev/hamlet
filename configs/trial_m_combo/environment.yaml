environment:
  version: "1.0"

  meters:
    - name: energy
      description: Energy
      range_type:
        kind: minmax
        clip: true
    - name: health
      description: Health
      range_type:
        kind: minmax
        clip: true
    - name: did_a
      description: "Progression trace: COMBO_A has been performed (0/1 event flag, unlocks COMBO_B)"
      range_type:
        kind: minmax
        clip: true
    - name: did_b
      description: "Progression trace: COMBO_B has been performed (0/1 event flag, unlocks COMBO_C)"
      range_type:
        kind: minmax
        clip: true

  cascade_graph: []
  modulation_graph: []
  affordances:
    - name: COMBO_A
      description: Combo opener (always available; sets did_a)
      category: combo
    - name: COMBO_B
      description: Combo link (gated on did_a; sets did_b)
      category: combo
    - name: COMBO_C
      description: Combo finisher (gated on did_b)
      category: combo

  variables: []
  cues: []
