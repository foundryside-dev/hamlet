bars:
  version: "1.0"
  meters:
    - name: energy
      initial: 0.5
      depletion:
        passive: 0.0
        move: 0.0
        interact: 0.0
      recovery:
        natural: 0.0
      bounds:
        min: 0.0
        max: 1.0
        lethal_min: true
        lethal_max: false

    - name: health
      initial: 1.0
      depletion:
        passive: 0.0
        move: 0.0
        interact: 0.0
      recovery:
        natural: 0.0
      bounds:
        min: 0.0
        max: 1.0
        lethal_min: true
        lethal_max: false

    # Progression trace for COMBO_A: an event flag, not a stock. Nothing spends
    # it, nothing decays it (all passive dynamics 0.0 — a drifting trace would be
    # Trial L's cooldown, not an unlock); COMBO_A's on_start sets it to 1.0 and
    # COMBO_B's gate requires-but-does-not-consume it.
    - name: did_a
      initial: 0.0
      depletion:
        passive: 0.0
        move: 0.0
        interact: 0.0
      recovery:
        natural: 0.0
      bounds:
        min: 0.0
        max: 1.0
        lethal_min: false
        lethal_max: false

    # Progression trace for COMBO_B — set only inside COMBO_B's gated branch, so
    # it can never become 1.0 unless did_a was 1.0 first (the chain).
    - name: did_b
      initial: 0.0
      depletion:
        passive: 0.0
        move: 0.0
        interact: 0.0
      recovery:
        natural: 0.0
      bounds:
        min: 0.0
        max: 1.0
        lethal_min: false
        lethal_max: false

  cascades: []
