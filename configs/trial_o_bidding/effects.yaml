version: "1.0"

effect_definitions:
  # The auction house: a standing clearing process. Every 3 ticks it runs the
  # global resolution phase over all agents' standing bids — compare (running
  # max), award (wins +1 to the highest bidder), charge (winner pays their bid
  # from credits), and expire every bid. Bids placed inside a window coexist
  # until the window closes, which is what makes the collection simultaneous
  # rather than first-come.
  #
  # Scope note (recorded in the trial): `scope: global` is declarable here but
  # every spawn path hardcodes agent scope, so this is declared agent-scoped
  # and pinned to slot 0 by the spawning affordances. It still executes engine-
  # side every tick; the attachment scope is a wart, not a behavior change.
  - id: "auction_house"
    scope: agent
    duration: 100000
    intensity: 1.0
    reapply_policy: renew
    observable: true

    on_spawn: []

    on_tick:
      - modify: vfs.auction_timer
        value: "vfs.auction_timer + 1.0"
      - if: "vfs.auction_timer >= 3.0"
        then:
          # Phase 1 — compare: running max over every agent's standing bid.
          - modify: vfs.highest_bid
            value: "0.0"
          - for_each: all_agents
            as: a
            do:
            - if: "target.bar.bid > vfs.highest_bid"
              then:
              - modify: vfs.highest_bid
                value: "target.bar.bid"
              else: []
          # Phase 2 — award and charge, only if anyone actually bid.
          - if: "vfs.highest_bid > 0.0"
            then:
            - for_each: all_agents
              as: a
              do:
              - if: "target.bar.bid >= vfs.highest_bid"
                then:
                - modify: target.bar.wins
                  value: "target.bar.wins + 1.0"
                - modify: target.bar.credits
                  value: "target.bar.credits - target.bar.bid"
                - modify: target.bar.bid
                  value: "0.0"
                else:
                - modify: target.bar.bid
                  value: "0.0"
            else: []
          - modify: vfs.auction_timer
            value: "0.0"
        else: []

    on_despawn: []
