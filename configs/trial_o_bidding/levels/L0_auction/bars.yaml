bars:
  version: "1.0"
  meters:
    - name: energy
      initial: 0.5
      depletion:
        passive: 0.0
        move: 0.0
        interact: 0.0
      recovery:
        natural: 0.0
      bounds:
        min: 0.0
        max: 1.0
        lethal_min: true
        lethal_max: false

    - name: health
      initial: 1.0
      depletion:
        passive: 0.0
        move: 0.0
        interact: 0.0
      recovery:
        natural: 0.0
      bounds:
        min: 0.0
        max: 1.0
        lethal_min: true
        lethal_max: false

    # Standing bid: written by the BID_* affordances, read and cleared by the
    # auction_house clearing effect. No passive dynamics — a bid stands until
    # the clearing phase consumes it.
    - name: bid
      initial: 0.0
      depletion:
        passive: 0.0
        move: 0.0
        interact: 0.0
      recovery:
        natural: 0.0
      bounds:
        min: 0.0
        max: 1.0
        lethal_min: false
        lethal_max: false

    # Auction wins: incremented only inside the clearing effect's winner branch.
    - name: wins
      initial: 0.0
      depletion:
        passive: 0.0
        move: 0.0
        interact: 0.0
      recovery:
        natural: 0.0
      bounds:
        min: 0.0
        max: 10.0
        lethal_min: false
        lethal_max: false

    # Currency: the winner pays their bid from this at clearing.
    - name: credits
      initial: 1.0
      depletion:
        passive: 0.0
        move: 0.0
        interact: 0.0
      recovery:
        natural: 0.0
      bounds:
        min: 0.0
        max: 1.0
        lethal_min: false
        lethal_max: false

  cascades: []
