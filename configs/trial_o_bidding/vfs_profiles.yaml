version: "1.0"
evaluation_mode: mark_and_sweep
debug_logging: false

global_profile:
  variables:
    # Clearing-phase scratch state: the running max the compare phase computes.
    - name: highest_bid
      semantic_type: custom
      type: float
      initial_value: 0.0
    # Window counter: the clearing phase fires when this reaches 3.
    - name: auction_timer
      semantic_type: custom
      type: float
      initial_value: 0.0

agent_profile: null

item_profiles:
  - profile_name: default_item
    variables: []
