version: "1.0"

effect_definitions:
  # The auction clearing step. Declared scope: global — this is the "global resolution
  # phase" the idea needs. It runs inside EffectManager.tick(), which fires AFTER every
  # agent's action for the tick has executed, so every bid submitted this tick is already
  # on the book before anything is compared, awarded or charged.
  - id: "auction_clearing"
    description: "Collect all agents' bids, compare, award the contested item to the highest bidder, charge them the clearing price."
    scope: global
    duration: 100000
    intensity: 1.0
    reapply_policy: renew
    observable: false

    on_spawn: []

    on_tick:
      # --- put a fresh contested item on the block, clear the registers -----
      - modify: vfs.prize_available
        value: "1.0"
      - modify: vfs.clearing_price
        value: "0.0"
      - modify: vfs.auction_awarded
        value: "0.0"
      - modify: vfs.prize_holder
        value: "-1.0"
      - modify: vfs.scan_index
        value: "0.0"

      # --- COLLECT: keep each agent's submission for the record -------------
      - for_each: "all_agents"
        as: "bidder"
        do:
          - modify: target.vfs.last_bid
            value: "target.vfs.bid"

      # --- COMPARE: highest bid across all agents ---------------------------
      - for_each: "all_agents"
        as: "bidder"
        do:
          - modify: vfs.clearing_price
            value: "max(vfs.clearing_price, target.vfs.bid)"

      # --- AWARD + CHARGE: exactly one winner, who pays the clearing price --
      - for_each: "all_agents"
        as: "bidder"
        do:
          - if: "target.vfs.bid >= vfs.clearing_price and vfs.clearing_price > 0.0 and vfs.auction_awarded < 0.5 and vfs.prize_available > 0.5"
            then:
              - modify: target.vfs.won_auction
                value: "1.0"
              - modify: target.bar.money
                value: "target.bar.money - vfs.clearing_price"
              - modify: vfs.prize_holder
                value: "vfs.scan_index"
              - modify: vfs.auction_awarded
                value: "1.0"
              - modify: vfs.prize_available
                value: "0.0"
            else:
              - modify: target.vfs.won_auction
                value: "0.0"
          # advance the scan counter AFTER the test, so it names the agent just examined
          - modify: vfs.scan_index
            value: "vfs.scan_index + 1.0"

      # --- clear the book for the next round --------------------------------
      - for_each: "all_agents"
        as: "bidder"
        do:
          - modify: target.vfs.bid
            value: "0.0"

    on_despawn: []
    on_interrupt: []
