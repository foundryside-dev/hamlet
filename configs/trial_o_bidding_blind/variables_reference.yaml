version: "1.0"
variables:
  - id: trust
    scope: pair
    type: scalar
    lifetime: episode
    readable_by: [agent, engine, social_model]
    writable_by: [engine, vtc]
    default: 0.5
    observable: false
    description: "Directed trust from one agent to another."

  - id: occupied_by
    scope: affordance
    type: agent_ref
    lifetime: tick
    readable_by: [engine, vtc]
    writable_by: [engine, vtc]
    default: null
    observable: false
    description: "Current claimant for each affordance row, using -1 for free rows."
