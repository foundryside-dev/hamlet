version: "1.0"
evaluation_mode: mark_and_sweep
debug_logging: false

global_profile:
  variables:
    # THE CONTESTED ITEM. One indivisible good is on the block each round;
    # the clearing step consumes it when it awards, so it cannot be won twice.
    - name: prize_available
      semantic_type: custom
      type: float
      initial_value: 1.0
      description: "1.0 while the contested item is unawarded this round, 0.0 once it has been won."
    - name: clearing_price
      semantic_type: custom
      type: float
      initial_value: 0.0
      description: "Highest bid submitted this round (the clearing price)."
    - name: prize_holder
      semantic_type: custom
      type: float
      initial_value: -1.0
      description: "Index of the agent holding the contested item; -1.0 while unowned."
    - name: scan_index
      semantic_type: custom
      type: float
      initial_value: 0.0
      description: "Position counter the clearing loop advances, so the winner's agent index can be recorded."
    - name: auction_awarded
      semantic_type: custom
      type: float
      initial_value: 0.0
      description: "1.0 once this round's contested item has been awarded to exactly one agent."

agent_profile:
  variables:
    - name: bid
      semantic_type: custom
      type: float
      initial_value: 0.0
      description: "This agent's bid for the contested item this round."
    - name: last_bid
      semantic_type: custom
      type: float
      initial_value: 0.0
      description: "The bid this agent submitted into the last clearing (kept after the book is cleared)."
    - name: won_auction
      semantic_type: custom
      type: float
      initial_value: 0.0
      description: "1.0 if this agent won the contested item at the last clearing."

item_profiles: []
