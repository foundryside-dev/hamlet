environment:
  version: '1.0'
  meters:
  - name: energy
    description: Physical energy for movement and actions
    range_type:
      kind: minmax
      clip: true
  - name: health
    description: Basic well-being; recover at doctor
    range_type:
      kind: minmax
      clip: true
  - name: money
    description: Economic resource for purchasing
    range_type:
      kind: minmax
      clip: true
  - name: sustenance
    description: Food and nutrition for maintaining energy
    range_type:
      kind: minmax
      clip: true
  cascade_graph: []
  modulation_graph: []
  affordances:
  - name: SLEEP
    description: Rest to restore energy
    category: NOT_A_CATEGORY
  - name: DOCTOR
    description: Medical checkup to restore health
    category: NOT_A_CATEGORY
  - name: WORK
    description: Earn money at the cost of energy
    category: NOT_A_CATEGORY
  - name: COOK
    description: Cook food to restore energy
    category: NOT_A_CATEGORY
  cues:
  - name: x
    trigger:
      bar: NO_SUCH_METER
      threshold: 0.1
      direction: below
    display:
      icon: '!'
      color: '#fff'
      message: m
