variables:
  version: '1.0'
  evaluation_mode: mark_and_sweep
  debug_logging: false
  extents: {}
  item_profiles: []
  declarations:
  - id: deficit_energy
    readable_by: &id001
    - engine
    - agent
    writable_by: &id002
    - engine
    scope: agent
    type: scalar
    lifetime: tick
    semantic_type: custom
    exposed_to: &id003
    - agent
    initial_value: 0.0
    normalization: &id004
      kind: minmax
      min: 0.0
      max: 1.0
      clip: true
    description: How far below target energy (0.0 = at/above target)
  - id: time_since_last_sleep
    readable_by:
    - engine
    - agent
    writable_by:
    - engine
    scope: agent
    type: scalar
    lifetime: tick
    semantic_type: custom
    exposed_to:
    - agent
    initial_value: 0.0
    normalization:
      kind: minmax
      min: 0.0
      max: 100.0
      clip: true
    description: Timesteps since last SLEEP action
  - id: deficit_energy_twin
    readable_by: *id001
    writable_by: *id002
    scope: agent
    type: scalar
    lifetime: tick
    semantic_type: custom
    exposed_to: *id003
    initial_value: 0.0
    normalization: *id004
    description: A DIFFERENT description
