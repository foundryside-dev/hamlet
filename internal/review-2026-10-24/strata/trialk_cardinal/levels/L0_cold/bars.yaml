bars:
  version: "1.0"
  meters:
    - name: energy
      initial: 0.5
      depletion: {passive: 0.0, move: 0.0, interact: 0.0}
      recovery: {natural: 0.0}
      bounds: {min: 0.0, max: 1.0, lethal_min: false, lethal_max: false}

    - name: health
      initial: 1.0
      depletion: {passive: 0.0, move: 0.0, interact: 0.0}
      recovery: {natural: 0.0}
      bounds: {min: 0.0, max: 1.0, lethal_min: true, lethal_max: false}

    # F3/F8 — the meter the world drives down. No passive depletion at all, so
    # any movement in this meter is attributable to the winter effect and not to
    # a baseline drain (the countersigner's F3 contrast requirement).
    # lethal_min: true is F8's declared consequence — eating the cost ends the
    # episode rather than being decorative.
    - name: comfort
      initial: 1.0
      depletion: {passive: 0.0, move: 0.0, interact: 0.0}
      recovery: {natural: 0.0}
      bounds: {min: 0.0, max: 1.0, lethal_min: true, lethal_max: false}

    # Per-agent view of the garment's item-declared insulation. Written only by
    # the coat's own on_use; never by the engine, never passively.
    - name: insulation_worn
      initial: 0.0
      depletion: {passive: 0.0, move: 0.0, interact: 0.0}
      recovery: {natural: 0.0}
      bounds: {min: 0.0, max: 1.0, lethal_min: false, lethal_max: false}

    # Probe witness for the per-tick landed magnitude (F2 warm-side zero,
    # F5 before/after, F7 crossing tick).
    - name: cold_bite
      initial: 0.0
      depletion: {passive: 0.0, move: 0.0, interact: 0.0}
      recovery: {natural: 0.0}
      bounds: {min: 0.0, max: 1.0, lethal_min: false, lethal_max: false}

  cascades: []
