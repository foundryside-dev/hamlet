variables:
  version: '1.0'
  extents: {}
  item_profiles: []
  declarations:
  - id: public_state
    scope: agent
    type: scalar
    lifetime: episode
    semantic_type: custom
    readable_by:
    - engine
    - agent
    writable_by:
    - engine
    exposed_to:
    - agent
    initial_value: 0.0
    normalization:
      kind: minmax
      min: 0.0
      max: 4.0
      clip: true
  - id: hidden_score
    scope: agent
    type: scalar
    lifetime: episode
    semantic_type: custom
    readable_by:
    - engine
    writable_by:
    - engine
    exposed_to: []
    initial_value: 2.0
  - id: immutable_scale
    scope: global
    type: scalar
    lifetime: persistent
    semantic_type: custom
    readable_by:
    - engine
    writable_by: []
    exposed_to: []
    initial_value: 0.5
  - id: readable_unexposed
    scope: agent
    type: scalar
    lifetime: episode
    semantic_type: custom
    readable_by:
    - engine
    - agent
    writable_by: []
    exposed_to: []
    initial_value: 7.0
  - id: scaled_public
    scope: agent
    type: scalar
    lifetime: episode
    semantic_type: custom
    readable_by:
    - engine
    - agent
    writable_by:
    - engine
    exposed_to: []
    initial_value: 0.0
    expression: public_state * immutable_scale
  - id: e_energy
    scope: agent
    type: scalar
    lifetime: episode
    semantic_type: custom
    readable_by:
    - engine
    - agent
    writable_by:
    - engine
    exposed_to:
    - agent
    initial_value: 0.0
    normalization:
      kind: minmax
      min: 0.0
      max: 2.0
      clip: true
    expression: bar.energy * 2.0
  - id: g_persist_tick
    scope: global
    type: scalar
    lifetime: persistent
    semantic_type: custom
    readable_by:
    - engine
    - agent
    writable_by:
    - engine
    exposed_to:
    - agent
    initial_value: 0.0
    normalization: &id001
      kind: minmax
      min: 0.0
      max: 100.0
      clip: true
    expression: tick
  - id: g_episode_tick
    scope: global
    type: scalar
    lifetime: episode
    semantic_type: custom
    readable_by:
    - engine
    - agent
    writable_by:
    - engine
    exposed_to:
    - agent
    initial_value: 0.0
    normalization: *id001
    expression: tick
  - id: tick_mirror
    scope: global
    type: scalar
    lifetime: tick
    semantic_type: custom
    readable_by:
    - engine
    - agent
    writable_by:
    - engine
    exposed_to:
    - agent
    initial_value: 0.0
    normalization: *id001
    expression: tick + 1.0
