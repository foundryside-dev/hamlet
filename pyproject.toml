[project]
name = "townlet"
version = "0.1.0"
description = "A pedagogical Deep Reinforcement Learning environment designed to trick students into learning graduate-level RL"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "John", email = "john@foundryside.dev" }
]
keywords = [
    "reinforcement-learning",
    "deep-learning",
    "machine-learning",
    "ai",
    "education",
    "drl",
    "q-learning",
    "lstm",
    "pomdp",
    "curriculum-learning",
    "intrinsic-motivation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Education",
    "Topic :: Scientific/Engineering",
    "Framework :: Pytest",
    "Typing :: Typed",
]
# Every entry below is imported somewhere in src/, tests/ or scripts/. Floors are
# the versions actually exercised, not aspirational lower bounds — an untested
# floor is a claim about compatibility that nothing verifies.
dependencies = [
    "numpy>=2.4.4",
    "torch>=2.13.0,<2.14",  # upper bound: triton 3.7.0 segfaults inside pytest (filigree hamlet-74197422b3)
    "tensorboard>=2.20.0",  # no direct import: required by torch.utils.tensorboard.SummaryWriter
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
    "websockets>=16.0",  # wire protocol behind fastapi.WebSocket / uvicorn[standard]
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "msgpack>=1.1.2",
    "lz4>=4.4.5",
    "pyparsing>=3.3.2",
]

[project.urls]
Homepage = "https://github.com/tachyon-beep/hamlet"
Repository = "https://github.com/tachyon-beep/hamlet"
Documentation = "https://github.com/tachyon-beep/hamlet/tree/main/docs"
Issues = "https://github.com/tachyon-beep/hamlet/issues"
Changelog = "https://github.com/tachyon-beep/hamlet/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2,<9.0.0",  # upper bound unverified against pytest 9; lift only with a full-suite run
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.3.0",
    "pytest-benchmark>=5.2.3",
    "black>=26.3.1",
    "ruff>=0.15.12",
    "mypy>=2.1.0",
    "types-PyYAML>=6.0.12.20260510",
    "hypothesis>=6.152.7",
    "vulture>=2.16",
]
# Consumed only by src/townlet/recording/. That subsystem is slated for removal
# once its intent is captured (filigree hamlet-16ae192d42) — delete this extra in
# the same change. msgpack/lz4 are not repeated here: they are runtime deps.
recording = [
    "ffmpeg-python>=0.2.0", # Video export
    "pillow>=12.2.0",       # Image manipulation
    "matplotlib>=3.10.9",   # Frame rendering
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/townlet"]

[tool.black]
line-length = 140
target-version = ['py313']

[tool.ruff]
line-length = 140
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Start lenient, can tighten later

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--cov=townlet",
    "--cov-branch",
    "--cov-report=term-missing",
]
filterwarnings = [
    "ignore:Module already imported so cannot be rewritten; tests.test_townlet._fixtures:pytest.PytestAssertRewriteWarning",
]
markers = [
    "gpu: marks tests requiring CUDA/GPU hardware",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
