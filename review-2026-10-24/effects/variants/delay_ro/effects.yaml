version: '1.0'
effect_definitions:
- id: ro
  scope: agent
  duration: 20
  reapply_policy: renew
  observable: true
  on_spawn:
  - modify: bar.health
    value: bar.health - 0.5
  - delay: '1'
    do:
    - modify: vfs.locked
      value: vfs.locked + 1.0
  on_tick: []
  on_despawn: []
  on_interrupt: []
max_active_effects:
  global: 1
  agent: 4
  item: 0
  affordance: 1
