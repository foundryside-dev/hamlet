version: '1.0'
effect_definitions:
- id: ds
  scope: agent
  duration: 20
  reapply_policy: renew
  observable: true
  on_spawn: []
  on_tick:
  - modify: bar.health
    value: bar.health - 0.1 * distance(bar.energy, bar.health)
  on_despawn: []
  on_interrupt: []
max_active_effects:
  global: 1
  agent: 4
  item: 0
  affordance: 1
