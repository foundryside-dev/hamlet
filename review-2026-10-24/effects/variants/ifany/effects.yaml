version: '1.0'
effect_definitions:
- id: c
  scope: agent
  duration: 20
  reapply_policy: renew
  observable: true
  on_spawn: []
  on_tick:
  - if: bar.health < 0.5
    then:
    - modify: bar.energy
      value: bar.energy - 0.5
    else: []
  on_despawn: []
  on_interrupt: []
max_active_effects:
  global: 1
  agent: 4
  item: 0
  affordance: 1
