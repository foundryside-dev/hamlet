version: '1.0'
effect_definitions:
- id: s
  scope: agent
  duration: 20
  reapply_policy: renew
  observable: true
  on_spawn: []
  on_tick:
  - modify: bar.health
    value: bar.health - (if in_range("FOOD", 2.0) then 0.1 else 0.0)
  on_despawn: []
  on_interrupt: []
max_active_effects:
  global: 1
  agent: 4
  item: 0
  affordance: 1
