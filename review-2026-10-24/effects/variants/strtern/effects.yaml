version: '1.0'
effect_definitions:
- id: st
  scope: agent
  duration: 20
  reapply_policy: renew
  observable: true
  on_spawn: []
  on_tick:
  - modify: bar.health
    value: bar.health - (if (if bar.health > 0.5 then "a" else "b") == "a" then 0.1
      else 0.0)
  on_despawn: []
  on_interrupt: []
max_active_effects:
  global: 1
  agent: 4
  item: 0
  affordance: 1
