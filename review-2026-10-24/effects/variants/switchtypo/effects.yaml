version: '1.0'
effect_definitions:
- id: sw
  scope: agent
  duration: 20
  reapply_policy: renew
  observable: true
  on_spawn: []
  on_tick:
  - switch: '1'
    cases:
    - when: '1'
      doo:
      - modify: bar.health
        value: '0.0'
    default:
    - modify: bar.health
      value: '0.5'
  on_despawn: []
  on_interrupt: []
max_active_effects:
  global: 1
  agent: 4
  item: 0
  affordance: 1
