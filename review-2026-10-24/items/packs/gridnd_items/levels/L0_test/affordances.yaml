affordances:
  version: '1.0'
  affordances:
  - name: EAT
    interaction_type: instant
    costs:
      money: 1.0
    opening_hours:
      enabled: false
    deployment:
      type: fixed
      positions:
      - - 0
        - 0
        - 0
        - 0
    interactions:
      on_start:
      - modify: target.bar.energy
        value: target.bar.energy + 0.1
      - modify: target.bar.health
        value: target.bar.health + 0.05
      per_tick: []
      on_completion: []
      on_early_exit: []
      on_failure: []
  - name: SLEEP
    interaction_type: instant
    costs: {}
    opening_hours:
      enabled: false
    deployment:
      type: fixed
      positions:
      - - 1
        - 0
        - 0
        - 0
    interactions:
      on_start:
      - modify: target.bar.energy
        value: target.bar.energy + 0.5
      - modify: target.bar.health
        value: target.bar.health + 0.1
      per_tick: []
      on_completion: []
      on_early_exit: []
      on_failure: []
  - name: WORK
    interaction_type: instant
    costs:
      energy: 0.05
    opening_hours:
      enabled: false
    deployment:
      type: fixed
      positions:
      - - 0
        - 1
        - 0
        - 0
    interactions:
      on_start:
      - modify: target.bar.money
        value: target.bar.money + 0.25
      per_tick: []
      on_completion: []
      on_early_exit: []
      on_failure: []
  - name: Bed
    interaction_type: instant
    costs: {}
    opening_hours:
      enabled: false
    deployment:
      type: fixed
      positions:
      - - 0
        - 0
        - 0
        - 0
    interactions:
      on_start:
      - modify: target.bar.energy
        value: target.bar.energy + 0.1
      per_tick: []
      on_completion: []
      on_early_exit: []
      on_failure: []
  modulations: []
