items:
  version: '1.0'
  item_types:
  - id: apple
    vfs_profile: default_item
    description: Restores energy when used
    duration: null
    cooldown: null
    interactions:
      on_pickup:
      - modify: target.vfs.inventory_weight
        value: target.vfs.inventory_weight + 0.5
      on_use:
      # Effects-command grammar: `spawn_effect: <id>` with sibling keys. Inside an item
      # command `target` is the agent using the item; `intensity` must be a float literal
      # (an expression is not representable in the effect's compiled identity).
      - spawn_effect: ate_food
        target: target
        intensity: 1.0
      on_drop: []
    name: Apple
    icon: "\U0001F34E"
    tags:
    - apple
  max_items_per_agent: 2
  max_items_in_world: 6
