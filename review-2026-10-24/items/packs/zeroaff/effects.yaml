version: "1.0"

effect_definitions:
  # Effect that modifies item VFS (durability decay)
  - id: "wear_and_tear"
    scope: item
    duration: 10
    reapply_policy: renew
    observable: true

    on_spawn: []

    on_tick:
      - modify: self.vfs.durability
        value: "self.vfs.durability - (1.0 * intensity)"

    on_despawn: []
    on_interrupt: []

  # Effect that reads item VFS and triggers cascade
  - id: "item_degradation"
    scope: item
    duration: 5
    reapply_policy: stack
    observable: true

    on_spawn:
      - modify: self.vfs.durability
        value: "self.vfs.durability - 5.0"

    on_tick: []

    on_despawn: []
    on_interrupt: []

  # Effect that spawns on item with low durability (cascade trigger)
  - id: "item_break"
    scope: item
    duration: 1
    reapply_policy: replace
    observable: true

    on_spawn:
      - modify: self.vfs.durability
        value: "0.0"

    on_tick: []

    on_despawn: []
    on_interrupt: []

  # Effect that reads item freshness (food items)
  - id: "food_decay"
    scope: item
    duration: 15
    reapply_policy: renew
    observable: true

    on_spawn: []

    on_tick:
      - modify: self.vfs.freshness
        value: "self.vfs.freshness - (2.0 * intensity)"

    on_despawn: []
    on_interrupt: []

# Per-scope budget of concurrently active effects (token-obs spec S2, required because
# effects are declared). Values: one active instance per declared effect per scope
# entity; a `stack`-policy effect exceeding its scope budget raises loudly at publish.
max_active_effects:
  global: 0
  agent: 0
  item: 4
  affordance: 0
