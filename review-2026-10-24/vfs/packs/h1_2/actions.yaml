actions:
  version: '1.0'
  substrate_actions:
    inherit: true
  custom_actions:
  - name: WAIT
    description: Do nothing (pass turn)
    enabled_by_default: true
  - name: ADVANCE
    description: Advance public state and engine-only reward state
    enabled_by_default: true
    writes:
    - variable_id: gvec
      expression: '1.0'
      condition: null
      composition: additive_delta
      phase: apply_completion_bonuses
      priority: 0
      clamp: null
      telemetry_label: w_gvec
    - variable_id: zone_heat
      expression: '1.0'
      condition: null
      composition: additive_delta
      phase: apply_completion_bonuses
      priority: 0
      clamp: null
      telemetry_label: w_zone_heat
  labels:
    preset: gaming
