actions:
  version: '1.0'
  substrate_actions:
    inherit: true
  custom_actions:
  - name: WAIT
    description: Do nothing (pass turn)
    enabled_by_default: true
  - name: ADVANCE
    description: Advance public state and engine-only reward state
    enabled_by_default: true
    writes:
    - variable_id: hunger
      expression: '0.1'
      condition: null
      composition: additive_delta
      phase: apply_completion_bonuses
      priority: 0
      clamp: null
      telemetry_label: w_hunger
    - variable_id: thirst
      expression: '0.3'
      condition: null
      composition: additive_delta
      phase: apply_completion_bonuses
      priority: 0
      clamp: null
      telemetry_label: w_thirst
  labels:
    preset: gaming
