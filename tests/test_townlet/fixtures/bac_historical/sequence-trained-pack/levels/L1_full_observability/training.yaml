run_metadata:
  output_subdir: L1_full_observability
training:
  version: '1.0'
  seed: 42
  population:
    size: 1
  enabled_affordances:
  - EAT
  - SLEEP
  - SHOWER
  - EXERCISE
  - WORK
  - SOCIALIZE
  - MEDITATE
  - DRINK_WATER
  - BRUSH_TEETH
  - LAUNDRY
  - COOK
  - CLEAN_HOUSE
  - ENTERTAINMENT
  - DOCTOR
  randomize_affordances: false
  enabled_actions:
    custom:
    - REST
    - MEDITATE
  q_learning:
    use_double_dqn: true
    gamma: 0.99
    learning_rate: 0.0001
    target_update_frequency: 1000
  replay_buffer:
    capacity: 64
    batch_size: 2
    min_size: 2
  exploration:
    epsilon_start: 0.8
    epsilon_end: 0.0
    epsilon_decay: 0.5
  intrinsic:
    rnd:
      feature_dim: 128
      learning_rate: 0.0001
    annealing:
      threshold: 100.0
      decay_rate: 0.995
      min_weight: 0.0
    initial_weight: 0.0
    min_survival_fraction: 0.4
    survival_window: 100
  training_loop:
    max_episodes: 16
    max_steps_per_episode: 2
    train_frequency: 1
    sequence_length: 2
    max_grad_norm: 10.0
    checkpointing:
      interval: 5000
  curriculum:
    strategy: static
    adversarial:
      difficulty_metric: survival_rate
      adaptation_rate: 0.1
      min_difficulty: 0.2
      max_difficulty: 1.0
      survival_advance_threshold: 0.7
      survival_retreat_threshold: 0.3
      entropy_gate: 0.5
      min_steps_at_stage: 1000
